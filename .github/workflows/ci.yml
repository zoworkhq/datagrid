# The gates that guard wave 1.
#
# "A gate added later never catches the regression that mattered" — so these
# exist before the code they guard. Seven are live today; what remains is
# declared and not yet wired, and is listed at the bottom of this file rather
# than left undiscovered. A gate that is quietly absent is worse than one that is
# openly pending.
name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1. Types. Every contract in wave 1 is a type-system decision, so this
      #    is the gate that actually guards them.
      - name: typecheck
        run: pnpm typecheck

      # 2. Behaviour. Includes the security tests that exist because the
      #    architecture review found three defects, the keyboard-only suite
      #    (no test in it dispatches a pointer event), the structural axe gate
      #    — which caught a critical role="grid" violation on the day it was
      #    wired — and the memory-leak gate, which mounts and unmounts 200
      #    times under --expose-gc and asserts bounded heap growth. Verified by
      #    injecting a leak: it reported 102 MB against a 12 MB threshold.
      - name: test
        run: pnpm test

      # 3. Layers. Implements ADR 0006; each rule names the record it enforces.
      - name: layer rules
        run: pnpm lint:layers

      # 4. Bundle budgets, per package, ratcheted.
      - name: size
        run: pnpm size

      # 5. Engine performance. Sort, filter, geometry and row-model heap at
      #    1k/10k/100k, compared against a recorded baseline with 40% headroom
      #    for runner noise — a ratchet that fails on noise gets disabled,
      #    which is worse than no ratchet.
      #
      #    NOTE: the ratchet SELF-SKIPS when the baseline's platform differs
      #    from the runner's, and the only baseline committed today is
      #    darwin-arm64. On linux-x64 CI it therefore prints and passes without
      #    comparing. To arm it, run `pnpm bench:write` on a runner and commit
      #    bench/baseline.linux-x64.json. Until then this step is a measurement,
      #    not a gate, and should not be described as one.
      - name: performance
        run: pnpm bench:check

  # ── Declared, not yet wired ────────────────────────────────────────────────
  #
  # accessibility  PARTIAL. Structural axe runs in jsdom on every commit. What
  #                is NOT covered: every rule needing layout — colour contrast,
  #                target size, focus-not-obscured — plus the NVDA / JAWS /
  #                VoiceOver x 3-engine matrix, which cannot be automated and
  #                governs leaving `experimental`. Plan it as work, not as a
  #                discovery. The cross-adapter tree assertion becomes
  #                meaningful when the second adapter exists (wave 4).
  # performance    PARTIAL. Engine operations are measured and ratchable (see
  #                step 5), but the ratchet is not yet armed on this runner.
  #                NOT measured at all: first paint, scroll frame time and INP.
  #                Those need a real engine with layout and a Playwright
  #                harness. Until that exists, the paint and 60 fps columns of
  #                the budget table are unverified claims — do not cite them as
  #                measured. CPU throttling also needs the browser harness.
  # memory         LIVE, inside step 2. What is NOT yet covered: plugin
  #                teardown, because the plugin registry does not exist until
  #                wave 3 proper. Cell-renderer teardown IS asserted.
