<style>
  /* ------------------------------------------------------------------ */
  /* Document tokens — Oxygen's own identity, shared with the other      */
  /* component briefs so the set reads as one series.                    */
  /* The mockups further down deliberately do NOT use these: they use    */
  /* Ant Design v6's real token values, so what you are judging is antd, */
  /* not a teal impression of it.                                        */
  /* ------------------------------------------------------------------ */
  :root {
    --paper: #f6faf8;
    --surface: #ffffff;
    --surface-2: #eef4f2;
    --ink: #0e1c19;
    --ink-2: #33473f;
    --muted: #5d716b;
    --rule: #d8e4df;
    --rule-2: #c3d3cd;
    --accent: #059478;
    --accent-2: #0bb08f;
    --accent-soft: #e6f7f1;
    --accent-ink: #045b4b;
    --stage: #0b1716;
    --stage-rule: #1c3230;
    --warn: #b7791f;
    --warn-soft: #fbf3e0;
    --warn-rule: #e4c98a;
    --bad: #b4423a;
    --bad-soft: #fbeceb;
    --bad-rule: #e8b5b0;
    --ok: #1f8f5f;
    --ok-soft: #e6f6ee;
    --ok-rule: #a9dcc3;
    --code-bg: #0f1e1c;
    --code-fg: #d9ece6;
    --code-k: #7ee0cd;
    --code-s: #f2c98a;
    --code-c: #7f9c94;
    --shadow: 0 1px 2px rgb(14 28 25 / 0.06), 0 8px 24px -12px rgb(14 28 25 / 0.18);
    --font-display: "Avenir Next", "Segoe UI Variable Display", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0b1514;
      --surface: #101d1b;
      --surface-2: #142522;
      --ink: #e7f2ee;
      --ink-2: #c3d6d0;
      --muted: #93aca5;
      --rule: #1f312e;
      --rule-2: #2c423e;
      --accent: #5fe0c9;
      --accent-2: #8aeedd;
      --accent-soft: #10302b;
      --accent-ink: #b8f3e7;
      --stage: #070f0e;
      --stage-rule: #1a2d2b;
      --warn: #e2b04a;
      --warn-soft: #2a2410;
      --warn-rule: #4d4020;
      --bad: #f0928a;
      --bad-soft: #2c1614;
      --bad-rule: #552a26;
      --ok: #5fd39a;
      --ok-soft: #10281d;
      --ok-rule: #23503a;
      --code-bg: #0a1413;
      --code-fg: #d9ece6;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 10px 30px -14px rgb(0 0 0 / 0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0b1514;
    --surface: #101d1b;
    --surface-2: #142522;
    --ink: #e7f2ee;
    --ink-2: #c3d6d0;
    --muted: #93aca5;
    --rule: #1f312e;
    --rule-2: #2c423e;
    --accent: #5fe0c9;
    --accent-2: #8aeedd;
    --accent-soft: #10302b;
    --accent-ink: #b8f3e7;
    --stage: #070f0e;
    --stage-rule: #1a2d2b;
    --warn: #e2b04a;
    --warn-soft: #2a2410;
    --warn-rule: #4d4020;
    --bad: #f0928a;
    --bad-soft: #2c1614;
    --bad-rule: #552a26;
    --ok: #5fd39a;
    --ok-soft: #10281d;
    --ok-rule: #23503a;
    --code-bg: #0a1413;
    --code-fg: #d9ece6;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 10px 30px -14px rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  a { color: var(--accent-ink); text-decoration-color: color-mix(in oklab, var(--accent) 50%, transparent); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(2.2rem, 4.5vw, 3.4rem); line-height: 1.05; font-weight: 600; }
  h2 { font-size: 1.75rem; line-height: 1.2; font-weight: 600; }
  h3 { font-size: 1.2rem; line-height: 1.3; font-weight: 600; margin-top: 2rem; }
  h4 { font-size: 1rem; line-height: 1.35; font-weight: 600; }
  p { margin: 0 0 1rem; }
  ul, ol { margin: 0 0 1rem; padding-inline-start: 1.35rem; }
  li { margin-bottom: 0.4rem; }
  li::marker { color: var(--accent); }
  strong { font-weight: 600; color: var(--ink); }
  code { font-family: var(--font-mono); font-size: 0.86em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2.5rem); }
  .prose { max-width: 68ch; }

  header.hero {
    padding: clamp(3rem, 9vw, 6.5rem) 0 clamp(2rem, 5vw, 3.5rem);
    border-bottom: 1px solid var(--rule);
    background:
      radial-gradient(1100px 420px at 12% -12%, color-mix(in oklab, var(--accent) 11%, transparent), transparent 62%),
      var(--paper);
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-ink);
    margin-bottom: 1.1rem;
  }
  .hero .lede { font-size: clamp(1.05rem, 2vw, 1.3rem); color: var(--ink-2); max-width: 62ch; margin-top: 1.25rem; }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 2rem; }
  .pill {
    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.05em;
    padding: 0.35rem 0.7rem; border-radius: 999px;
    border: 1px solid var(--rule-2); background: var(--surface); color: var(--muted);
  }
  .pill.on { border-color: color-mix(in oklab, var(--accent) 45%, transparent); background: var(--accent-soft); color: var(--accent-ink); }

  nav.toc { border-bottom: 1px solid var(--rule); background: var(--surface); position: sticky; top: 0; z-index: 40; }
  nav.toc .wrap { display: flex; gap: 0.25rem; overflow-x: auto; padding-block: 0.5rem; scrollbar-width: thin; }
  nav.toc a {
    flex: 0 0 auto; font-size: 0.8rem; padding: 0.35rem 0.65rem; border-radius: 6px;
    color: var(--muted); text-decoration: none; white-space: nowrap;
  }
  nav.toc a:hover { background: var(--surface-2); color: var(--ink); }

  section { padding: clamp(2.75rem, 6vw, 4.5rem) 0; border-bottom: 1px solid var(--rule); scroll-margin-top: 3.5rem; }
  section > .wrap > .sec-head { margin-bottom: 2rem; }
  .sec-num {
    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.14em;
    color: var(--accent); text-transform: uppercase; display: block; margin-bottom: 0.5rem;
  }
  .sec-head p { color: var(--ink-2); max-width: 66ch; margin-top: 0.75rem; }

  .grid { display: grid; gap: 1rem; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

  .card {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 12px; padding: 1.25rem 1.35rem; box-shadow: var(--shadow);
  }
  .card h4 { margin-bottom: 0.5rem; }
  .card p:last-child, .card ul:last-child { margin-bottom: 0; }
  .card .k { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 0.4rem; }

  .note {
    border-inline-start: 3px solid var(--accent);
    background: var(--accent-soft); color: var(--accent-ink);
    padding: 1rem 1.15rem; border-radius: 0 10px 10px 0; margin: 1.5rem 0;
  }
  .note.warn { border-color: var(--warn); background: var(--warn-soft); color: var(--ink); }
  .note.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--ink); }
  .note.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ink); }
  .note p:last-child { margin-bottom: 0; }
  .note .lbl { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; display: block; margin-bottom: 0.4rem; opacity: 0.85; }

  .tw { overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); margin: 1.5rem 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.88rem; min-width: 560px; }
  th, td { text-align: start; padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  td code { white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }
  .yes { color: var(--ok); font-weight: 600; }
  .no { color: var(--bad); font-weight: 600; }
  .meh { color: var(--warn); font-weight: 600; }

  pre {
    background: var(--code-bg); color: var(--code-fg); border-radius: 12px;
    padding: 1.1rem 1.25rem; overflow-x: auto; font-family: var(--font-mono);
    font-size: 0.8rem; line-height: 1.65; margin: 1.25rem 0; border: 1px solid var(--stage-rule);
  }
  pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
  .c-k { color: var(--code-k); }
  .c-s { color: var(--code-s); }
  .c-c { color: var(--code-c); font-style: italic; }

  figure { margin: 1.75rem 0; }
  figcaption {
    font-size: 0.82rem; color: var(--muted); margin-top: 0.75rem;
    padding-inline-start: 0.9rem; border-inline-start: 2px solid var(--rule-2);
  }
  figcaption b { color: var(--ink-2); font-weight: 600; }
  .stage {
    background: linear-gradient(var(--surface-2) 0 0) padding-box, var(--surface);
    border: 1px solid var(--rule); border-radius: 14px;
    padding: clamp(1rem, 3vw, 2rem); overflow-x: auto;
  }

  /* ------------------------------------------------------------------ */
  /* ANT DESIGN mockup primitives — real antd v6 default token values.   */
  /* Kept in their own namespace so the document's teal never leaks in.  */
  /* ------------------------------------------------------------------ */
  .antd {
    --a-primary: #1677ff;
    --a-primary-bg: #e6f4ff;
    --a-primary-border: #91caff;
    --a-success: #52c41a;
    --a-success-bg: #f6ffed;
    --a-success-border: #b7eb8f;
    --a-warning: #faad14;
    --a-warning-bg: #fffbe6;
    --a-warning-border: #ffe58f;
    --a-error: #ff4d4f;
    --a-error-bg: #fff2f0;
    --a-error-border: #ffccc7;
    --a-purple: #722ed1;
    --a-purple-bg: #f9f0ff;
    --a-purple-border: #d3adf7;
    --a-cyan: #13c2c2;
    --a-cyan-bg: #e6fffb;
    --a-cyan-border: #87e8de;
    --a-magenta: #eb2f96;
    --a-magenta-bg: #fff0f6;
    --a-magenta-border: #ffadd2;
    --a-text: rgba(0, 0, 0, 0.88);
    --a-text-2: rgba(0, 0, 0, 0.65);
    --a-text-3: rgba(0, 0, 0, 0.45);
    --a-text-4: rgba(0, 0, 0, 0.25);
    --a-border: #d9d9d9;
    --a-border-2: #f0f0f0;
    --a-bg: #ffffff;
    --a-bg-layout: #f5f5f5;
    --a-fill-3: rgba(0, 0, 0, 0.04);
    --a-fill-2: rgba(0, 0, 0, 0.06);
    --a-radius: 6px;
    --a-radius-lg: 8px;
    --a-radius-sm: 4px;
    --a-h: 32px;
    --a-h-sm: 24px;
    --a-shadow: 0 6px 16px 0 rgb(0 0 0 / 0.08), 0 3px 6px -4px rgb(0 0 0 / 0.12), 0 9px 28px 8px rgb(0 0 0 / 0.05);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    font-size: 14px;
    line-height: 1.5714;
    color: var(--a-text);
  }
  .antd code {
    background: var(--a-fill-3); color: var(--a-text);
    border: 1px solid var(--a-border-2); border-radius: var(--a-radius-sm);
    padding: 1px 5px; font-size: 12px;
  }
  .a-card {
    background: var(--a-bg); border-radius: var(--a-radius-lg);
    box-shadow: var(--a-shadow); width: 100%; max-width: 560px; margin: 0 auto;
  }
  .a-card.wide { max-width: 860px; }
  .a-card.xwide { max-width: 1040px; }
  .a-card.pins { overflow: visible; }
  .a-card-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
    padding: 16px 20px; border-bottom: 1px solid var(--a-border-2);
  }
  .a-card-title { font-size: 16px; font-weight: 600; line-height: 1.5; color: var(--a-text); }
  .a-card-sub { font-size: 12px; color: var(--a-text-3); margin-top: 2px; }
  .a-card-body { padding: 16px 20px; }
  .a-card-body.flush { padding: 0; }
  .a-card-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 11px 20px; border-top: 1px solid var(--a-border-2);
    font-size: 12px; color: var(--a-text-3);
  }
  .a-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: var(--a-h); padding: 0 15px; border-radius: var(--a-radius);
    border: 1px solid var(--a-border); background: var(--a-bg); color: var(--a-text);
    font-size: 14px; font-weight: 400; white-space: nowrap;
  }
  .a-btn.primary { background: var(--a-primary); border-color: var(--a-primary); color: #fff; }
  .a-btn.text { border-color: transparent; background: transparent; color: var(--a-text-2); }
  .a-btn.link { border-color: transparent; background: transparent; color: var(--a-primary); padding: 0; height: auto; }
  .a-btn.sm { height: var(--a-h-sm); padding: 0 9px; font-size: 12px; }
  .a-btn.on { color: var(--a-primary); border-color: var(--a-primary); background: var(--a-primary-bg); }
  .a-alert {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 9px 12px; border-radius: var(--a-radius); font-size: 13px;
    border: 1px solid var(--a-primary-border); background: var(--a-primary-bg); color: var(--a-text);
  }
  .a-alert.warning { border-color: var(--a-warning-border); background: var(--a-warning-bg); }
  .a-alert.error { border-color: var(--a-error-border); background: var(--a-error-bg); }
  .a-alert .ic { flex: 0 0 auto; margin-top: 2px; }
  .a-alert b { font-weight: 600; }
  .a-tag {
    display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px;
    font-size: 11px; line-height: 18px; border-radius: var(--a-radius-sm);
    border: 1px solid var(--a-border); background: var(--a-fill-3); color: var(--a-text-2);
    white-space: nowrap;
  }
  .a-tag.blue { border-color: var(--a-primary-border); background: var(--a-primary-bg); color: var(--a-primary); }
  .a-tag.green { border-color: var(--a-success-border); background: var(--a-success-bg); color: #389e0d; }
  .a-tag.gold { border-color: var(--a-warning-border); background: var(--a-warning-bg); color: #d48806; }
  .a-tag.red { border-color: var(--a-error-border); background: var(--a-error-bg); color: var(--a-error); }
  .a-tag.purple { border-color: var(--a-purple-border); background: var(--a-purple-bg); color: var(--a-purple); }
  .a-tag.cyan { border-color: var(--a-cyan-border); background: var(--a-cyan-bg); color: #08979c; }
  .a-tag.magenta { border-color: var(--a-magenta-border); background: var(--a-magenta-bg); color: #c41d7f; }
  .a-tag.plain { border-color: var(--a-border-2); background: transparent; color: var(--a-text-3); }

  /* ------------------------------------------------------------------ */
  /* Icons — Lucide geometry: 24px grid, 2px stroke, round caps.         */
  /* ------------------------------------------------------------------ */
  .i {
    width: 16px; height: 16px; flex: 0 0 auto; display: block;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .i-14 { width: 14px; height: 14px; stroke-width: 2.15; }
  .i-18 { width: 18px; height: 18px; stroke-width: 1.9; }
  .i-20 { width: 20px; height: 20px; stroke-width: 1.85; }

  /* ------------------------------------------------------------------ */
  /* Timeline mockup primitives.                                         */
  /* The rail is a real grid column, not an absolutely positioned line —  */
  /* so it survives reflow, zoom and a long title wrapping to 4 lines.   */
  /* ------------------------------------------------------------------ */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl > li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; position: relative; }
  .tl > li > .rail { display: grid; grid-template-rows: auto 1fr; justify-items: center; }
  .antd .node {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    background: var(--a-bg); border: 1px solid var(--a-border); color: var(--a-text-2); flex: 0 0 auto;
  }
  .antd .node.clinical { border-color: var(--a-primary-border); background: var(--a-primary-bg); color: var(--a-primary); }
  .antd .node.admin { border-color: var(--a-border); background: var(--a-fill-3); color: var(--a-text-2); }
  .antd .node.comms { border-color: var(--a-cyan-border); background: var(--a-cyan-bg); color: #08979c; }
  .antd .node.reported { border-color: var(--a-magenta-border); background: var(--a-magenta-bg); color: #c41d7f; }
  .antd .node.critical { border-color: var(--a-error-border); background: var(--a-error-bg); color: var(--a-error); }
  .antd .node.planned { border-style: dashed; border-color: var(--a-border); background: transparent; color: var(--a-text-3); }
  .tl .line { width: 1px; background: var(--a-border-2); margin: 6px 0 0; min-height: 8px; align-self: stretch; }
  /* A DOTTED rail segment is not decoration: it means records may be
     missing between the two events it joins. Paired with a worded label. */
  .tl .line.gap { background: none; border-inline-start: 1px dashed var(--a-warning); width: 0; }
  .tl > li:last-child .line { display: none; }
  .tl .body { padding-bottom: 18px; min-width: 0; }
  .tl > li:last-child .body { padding-bottom: 0; }
  .antd .kind {
    font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--a-text-3); font-weight: 600; margin-bottom: 2px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .antd .ttl { font-size: 14px; font-weight: 600; color: var(--a-text); line-height: 1.45; }
  .antd .ttl a { color: var(--a-text); text-decoration: none; border-bottom: 1px solid var(--a-border); }
  .antd .det { font-size: 13px; color: var(--a-text-2); margin-top: 3px; line-height: 1.5; }
  .antd .who { font-size: 12.5px; color: var(--a-text-2); margin-top: 4px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .antd .when {
    font-size: 12px; color: var(--a-text-3); margin-top: 5px;
    font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .antd .when .ago { color: var(--a-text-4); }
  .antd .when .src { color: var(--a-text-4); }
  .antd .struck .ttl, .antd .struck .det { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--a-text-3); }
  .antd .box {
    margin-top: 8px; border: 1px solid var(--a-border-2); border-radius: var(--a-radius);
    padding: 8px 11px; font-size: 12.5px; color: var(--a-text-2); background: var(--a-fill-3);
  }
  .antd .box.err { border-color: var(--a-error-border); background: var(--a-error-bg); }
  .antd .box.warnb { border-color: var(--a-warning-border); background: var(--a-warning-bg); }
  .antd .steps { margin: 7px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; }
  .antd .steps li {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: baseline;
    font-size: 12.5px; color: var(--a-text-2); margin: 0;
  }
  .antd .steps .t { color: var(--a-text-4); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .antd .steps .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--a-border); margin-top: 6px; }
  .antd .steps .dot.done { background: var(--a-success); }
  .antd .steps .dot.open { background: transparent; box-shadow: inset 0 0 0 1.5px var(--a-warning); }

  /* Month / group header, sticky inside a scrolling chart pane */
  .tl-grp {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--a-text-3); font-weight: 600; padding: 10px 0 8px;
    background: var(--a-bg);
  }
  .tl-grp .rule { flex: 1 1 auto; height: 1px; background: var(--a-border-2); }
  .tl-grp .n { color: var(--a-text-4); font-weight: 400; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }

  /* The divider that answers "what is new since I last looked" */
  .tl-since {
    display: flex; align-items: center; gap: 10px; padding: 6px 0 12px;
    font-size: 11.5px; color: var(--a-primary); font-weight: 600;
  }
  .tl-since .rule { flex: 1 1 auto; height: 1px; background: var(--a-primary-border); }
  .tl-now { color: #d48806; }
  .tl-now .rule { background: var(--a-warning-border); }

  /* The coverage statement. Always rendered, always printed. */
  .cov {
    display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap;
    font-size: 12px; color: var(--a-text-2); line-height: 1.55;
  }
  .cov .lead { font-weight: 600; color: var(--a-text); }
  .cov-srcs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .srcpill {
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
    border-radius: 999px; font-size: 11.5px; color: var(--a-text-2);
    box-shadow: inset 0 0 0 1px var(--a-border-2); background: var(--a-bg);
  }
  .srcpill .d { width: 7px; height: 7px; border-radius: 50%; background: var(--a-success); flex: 0 0 auto; }
  .srcpill.partial .d { background: var(--a-warning); }
  .srcpill.down { box-shadow: inset 0 0 0 1px var(--a-error-border); background: var(--a-error-bg); color: var(--a-error); }
  .srcpill.down .d { background: var(--a-error); }
  .srcpill.excluded { color: var(--a-text-4); }
  .srcpill.excluded .d { background: var(--a-text-4); }

  /* Two-column register mode */
  .tl-reg { display: grid; grid-template-columns: 1fr 33px 1fr; gap: 0 12px; }
  .tl-reg .col-h {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
    color: var(--a-text-3); padding-bottom: 8px;
  }
  .tl-reg .col-h.r { text-align: end; }
  .tl-reg .spine { grid-column: 2; border-inline-start: 1px solid var(--a-border-2); margin-inline-start: 16px; }
  .tl-reg .ev { padding: 0 0 16px; }
  .tl-reg .ev.r { grid-column: 3; }
  .tl-reg .ev.l { grid-column: 1; text-align: end; }
  .tl-reg .mid { grid-column: 2; display: grid; place-items: center; position: relative; }
  /* the rail, drawn behind the node rather than as a sibling element */
  .tl-reg .mid::before {
    content: ""; position: absolute; top: 0; bottom: -16px;
    inset-inline-start: 50%; width: 1px; background: var(--a-border-2); transform: translateX(-50%);
  }
  .tl-reg .mid.last::before { bottom: 50%; }
  .tl-reg .mid > .node { position: relative; z-index: 1; }

  /* Compact density */
  .tl.compact > li { grid-template-columns: 22px 1fr; gap: 9px; }
  .tl.compact .node { width: 22px; height: 22px; }
  .tl.compact .body { padding-bottom: 9px; }
  .tl.compact .ttl { font-size: 13px; font-weight: 500; }
  .tl.compact .kind { margin-bottom: 0; }
  .tl.compact .when { margin-top: 1px; }

  .cluster {
    display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--a-text-2);
    border: 1px dashed var(--a-border); border-radius: var(--a-radius); padding: 7px 11px;
    background: var(--a-fill-3);
  }
  .cluster b { font-weight: 600; color: var(--a-text); }

  /* ------------------------------------------------------------------ */
  /* Annotation pins — anchored to the element they describe.            */
  /* ------------------------------------------------------------------ */
  .rel { position: relative; }
  .pin {
    position: absolute; z-index: 6;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    display: grid; place-items: center; line-height: 1;
    box-shadow: 0 0 0 2px var(--a-bg), 0 0 0 3.5px color-mix(in oklab, var(--accent) 40%, transparent);
  }
  .pin.bad { background: var(--bad); box-shadow: 0 0 0 2px var(--a-bg), 0 0 0 3.5px color-mix(in oklab, var(--bad) 40%, transparent); }
  .pin-tl { top: -10px; inset-inline-start: -10px; }
  .pin-tr { top: -10px; inset-inline-end: -10px; }
  .pin-bl { bottom: -10px; inset-inline-start: -10px; }
  .pin-br { bottom: -10px; inset-inline-end: -10px; }
  .pin-l  { top: 50%; inset-inline-start: -10px; transform: translateY(-50%); }
  .pin-r  { top: 50%; inset-inline-end: -10px; transform: translateY(-50%); }

  .anno-key { margin-top: 1.5rem; display: grid; gap: 0.6rem; padding: 0; }
  .anno-key li { display: flex; gap: 0.65rem; align-items: flex-start; font-size: 0.88rem; color: var(--ink-2); list-style: none; margin: 0; }
  .anno-key .n {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: #fff; font-family: var(--font-mono);
    font-size: 10px; font-weight: 700; display: grid; place-items: center; margin-top: 2px;
  }
  .anno-key .n.bad { background: var(--bad); }

  .feat { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--surface); margin: 1.5rem 0; }
  .feat > div { display: grid; grid-template-columns: 2.5rem 1fr; gap: 0.9rem; padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--rule); }
  .feat > div:last-child { border-bottom: 0; }
  .feat .n { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); padding-top: 0.15rem; }
  .feat .t { font-weight: 600; margin-bottom: 0.15rem; }
  .feat .d { font-size: 0.9rem; color: var(--ink-2); }
  .badge { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.1rem 0.4rem; border-radius: 4px; margin-inline-start: 0.5rem; vertical-align: 0.1em; white-space: nowrap; }
  .badge.v1 { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent); }
  .badge.v2 { background: var(--surface-2); color: var(--muted); border: 1px solid var(--rule-2); }
  .badge.host { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-rule); }
  .badge.never { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-rule); }
  .grp-h { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 2rem 0 0.5rem; }

  .phases { display: grid; gap: 1rem; }
  .phase { display: grid; grid-template-columns: auto 1fr; gap: 1.1rem; }
  .phase .prail { display: grid; grid-template-rows: auto 1fr; justify-items: center; }
  .phase .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); border: 2px solid var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; display: grid; place-items: center; }
  .phase .pline { width: 2px; background: var(--rule); margin-top: 4px; min-height: 1rem; }
  .phase:last-child .pline { display: none; }
  .phase .body { padding-bottom: 1.25rem; }
  .phase .body h4 { margin-bottom: 0.3rem; }
  .phase .meta { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }

  .layers { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; font-family: var(--font-mono); font-size: 0.8rem; }
  .layers > div { padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--rule); background: var(--surface); display: grid; grid-template-columns: 5.5rem 1fr; gap: 1rem; align-items: baseline; }
  .layers > div:last-child { border-bottom: 0; }
  .layers .l { color: var(--accent); font-weight: 700; }
  .layers .d { color: var(--ink-2); font-family: var(--font-body); font-size: 0.88rem; }

  footer { padding: 3rem 0 4rem; color: var(--muted); font-size: 0.85rem; }
  footer .wrap > div + div { margin-top: 0.5rem; }

  @media (max-width: 760px) {
    .tl-reg { grid-template-columns: 1fr; }
    .tl-reg .spine, .tl-reg .mid, .tl-reg .col-h.r { display: none; }
    .tl-reg .ev, .tl-reg .ev.l, .tl-reg .ev.r { grid-column: 1; text-align: start; }
  }
  @media print {
    nav.toc { display: none; }
    section { break-inside: avoid; }
  }

  /* ==================================================================== */
  /* REPORT CHROME — additions specific to the 50-component brief.        */
  /* ==================================================================== */

  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; margin: 1.75rem 0; }
  .kpi > div { background: var(--surface); padding: 1.05rem 1.15rem; }
  .kpi .v { font-family: var(--font-display); font-size: 1.75rem; font-weight: 600; line-height: 1; letter-spacing: -0.02em; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 0.78rem; color: var(--muted); margin-top: 0.45rem; line-height: 1.35; }

  /* Component entry -------------------------------------------------- */
  .comp { border-top: 1px solid var(--rule); padding: 2.5rem 0 0.5rem; scroll-margin-top: 3.5rem; }
  .comp:first-of-type { border-top: 0; }
  .comp-head { display: grid; grid-template-columns: auto 1fr; gap: 1.1rem; align-items: start; margin-bottom: 1.25rem; }
  .comp-n { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; color: var(--accent); background: var(--accent-soft); border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent); border-radius: 8px; width: 2.6rem; height: 2.6rem; display: grid; place-items: center; }
  .comp-head h3 { margin: 0; font-size: 1.32rem; letter-spacing: -0.02em; }
  .comp-head h3 .api { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-inline-start: 0.5rem; }
  .comp-line { margin: 0.45rem 0 0; color: var(--ink-2); max-width: 74ch; font-size: 1.02rem; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.6rem; }
  .tg { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 5px; border: 1px solid var(--rule-2); color: var(--muted); background: var(--surface); }
  .tg.core { border-color: #9bb7cf; color: #2b5f86; background: #eef5fa; }
  .tg.pro { border-color: #b7a6d8; color: #5b3f96; background: #f4f0fb; }
  .tg.ai { border-color: #8fd0c6; color: #0f6f62; background: #e8f7f4; }
  .tg.bh { border-color: #d9b0c4; color: #8f3d69; background: #fbeff5; }
  .tg.viz { border-color: #cbbb92; color: #7a5c1c; background: #faf4e6; }
  .tg.ent { border-color: #a9b0bb; color: #3d4653; background: #f1f3f6; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .tg.core { border-color: #2f4a5e; color: #9dcdf0; background: #12242f; }
    :root:not([data-theme="light"]) .tg.pro { border-color: #463a63; color: #c9b2f2; background: #1e1830; }
    :root:not([data-theme="light"]) .tg.ai { border-color: #24544c; color: #7fe3d1; background: #0e2723; }
    :root:not([data-theme="light"]) .tg.bh { border-color: #5c3247; color: #efaecd; background: #2a1522; }
    :root:not([data-theme="light"]) .tg.viz { border-color: #55492a; color: #ded0a1; background: #241f10; }
    :root:not([data-theme="light"]) .tg.ent { border-color: #3a4048; color: #c3ccd8; background: #1a1e23; }
  }
  :root[data-theme="dark"] .tg.core { border-color: #2f4a5e; color: #9dcdf0; background: #12242f; }
  :root[data-theme="dark"] .tg.pro { border-color: #463a63; color: #c9b2f2; background: #1e1830; }
  :root[data-theme="dark"] .tg.ai { border-color: #24544c; color: #7fe3d1; background: #0e2723; }
  :root[data-theme="dark"] .tg.bh { border-color: #5c3247; color: #efaecd; background: #2a1522; }
  :root[data-theme="dark"] .tg.viz { border-color: #55492a; color: #ded0a1; background: #241f10; }
  :root[data-theme="dark"] .tg.ent { border-color: #3a4048; color: #c3ccd8; background: #1a1e23; }

  .comp-cols { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 1.75rem; align-items: start; }
  @media (max-width: 900px) { .comp-cols { grid-template-columns: 1fr; } }
  .comp-body > .blk { margin-bottom: 1.15rem; }
  .comp-body .blk:last-child { margin-bottom: 0; }
  .blk > .k { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 0.3rem; }
  .blk p { margin: 0 0 0.5rem; color: var(--ink-2); }
  .blk p:last-child { margin-bottom: 0; }
  .blk ul { margin: 0; padding-inline-start: 1.15rem; }
  .blk li { color: var(--ink-2); margin-bottom: 0.25rem; }

  .spec { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 1rem 1.1rem; box-shadow: var(--shadow); position: sticky; top: 3.75rem; }
  .spec h5 { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.7rem; font-weight: 600; }
  .spec + .spec { margin-top: 0.85rem; }
  .score { display: grid; grid-template-columns: 5.6rem 1fr 1.2rem; gap: 0.5rem; align-items: center; margin-bottom: 0.4rem; font-size: 0.76rem; color: var(--ink-2); }
  .score .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--rule); }
  .score .bar i { display: block; height: 100%; background: var(--accent); }
  .score .bar.hi i { background: var(--accent); }
  .score .n { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); text-align: end; font-variant-numeric: tabular-nums; }
  .spec dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 0.7rem; font-size: 0.78rem; }
  .spec dt { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 0.12rem; }
  .spec dd { margin: 0; color: var(--ink-2); }
  .spec .rankline { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent-ink); background: var(--accent-soft); border-radius: 6px; padding: 0.35rem 0.5rem; text-align: center; margin-top: 0.6rem; letter-spacing: 0.04em; }

  /* Matrix ------------------------------------------------------------ */
  .matrix { position: relative; border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); padding: 2.4rem 1.2rem 2.6rem 3rem; margin: 1.75rem 0; overflow-x: auto; }
  .mx-plot { position: relative; height: 560px; min-width: 620px; border-inline-start: 2px solid var(--rule-2); border-bottom: 2px solid var(--rule-2); }
  .mx-q { position: absolute; inset: auto; font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 0.3rem 0.45rem; }
  .mx-cell { position: absolute; width: 50%; height: 50%; }
  .mx-cell.tl { left: 0; top: 0; } .mx-cell.tr { left: 50%; top: 0; background: color-mix(in oklab, var(--accent) 7%, transparent); }
  .mx-cell.bl { left: 0; top: 50%; } .mx-cell.br { left: 50%; top: 50%; }
  .mx-cell b { position: absolute; inset-block-start: 0.5rem; inset-inline-start: 0.6rem; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .mx-cell.tr b { color: var(--accent-ink); }
  .mx-dot { position: absolute; transform: translate(-50%, 50%); width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--surface); }
  .mx-dot::after { content: attr(data-n); position: absolute; inset-inline-start: 13px; inset-block-start: -6px; font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-2); white-space: nowrap; }
  .mx-ax { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .mx-ax.x { text-align: center; margin-top: 0.7rem; }
  .mx-ax.y { position: absolute; inset-inline-start: 0.55rem; inset-block-start: 50%; transform: rotate(180deg) translateY(50%); writing-mode: vertical-rl; }
  .mx-key { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; font-size: 0.76rem; color: var(--muted); }
  .mx-key span { display: inline-flex; align-items: center; gap: 0.35rem; }
  .mx-key i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  /* Rank lists --------------------------------------------------------- */
  .ranks { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
  .rank { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 1.1rem 1.2rem; box-shadow: var(--shadow); }
  .rank h4 { margin-bottom: 0.15rem; }
  .rank .why { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.8rem; }
  .rank ol { margin: 0; padding-inline-start: 1.4rem; font-size: 0.87rem; }
  .rank ol li { margin-bottom: 0.35rem; color: var(--ink-2); }
  .rank ol li b { color: var(--ink); font-weight: 600; }
  .rank ol li .sc { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); }

  /* Engine map --------------------------------------------------------- */
  .eng { border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); overflow: hidden; margin-bottom: 0.85rem; }
  .eng-h { display: flex; align-items: center; gap: 0.65rem; padding: 0.8rem 1.05rem; border-bottom: 1px solid var(--rule); background: var(--surface-2); flex-wrap: wrap; }
  .eng-h b { font-family: var(--font-mono); font-size: 0.82rem; letter-spacing: -0.01em; }
  .eng-h .st { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.15rem 0.42rem; border-radius: 4px; border: 1px solid var(--rule-2); color: var(--muted); }
  .eng-h .st.ship { border-color: color-mix(in oklab, var(--ok) 45%, transparent); background: var(--ok-soft); color: var(--ok); }
  .eng-h .st.part { border-color: color-mix(in oklab, var(--warn) 45%, transparent); background: var(--warn-soft); color: var(--warn); }
  .eng-h .st.new { border-color: color-mix(in oklab, var(--accent) 40%, transparent); background: var(--accent-soft); color: var(--accent-ink); }
  .eng-b { padding: 0.8rem 1.05rem; font-size: 0.86rem; color: var(--ink-2); }
  .eng-b .feeds { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.6rem; }
  .eng-b .feeds a { font-family: var(--font-mono); font-size: 0.68rem; padding: 0.16rem 0.42rem; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--rule); color: var(--ink-2); text-decoration: none; }
  .eng-b .feeds a:hover { border-color: var(--accent); color: var(--accent-ink); }

  .idx { columns: 3 200px; column-gap: 1.5rem; font-size: 0.85rem; }
  .idx a { display: block; padding: 0.18rem 0; text-decoration: none; color: var(--ink-2); break-inside: avoid; }
  .idx a:hover { color: var(--accent-ink); }
  .idx a i { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); font-style: normal; margin-inline-end: 0.4rem; }

  /* ==================================================================== */
  /* MOCKUP PRIMITIVES — all inside .antd, real Ant Design v6 tokens.     */
  /* ==================================================================== */
  .antd * { box-sizing: border-box; }
  .antd .row { display: flex; align-items: center; gap: 8px; }
  .antd .row.wrap { flex-wrap: wrap; }
  .antd .col { display: flex; flex-direction: column; gap: 6px; }
  .antd .grow { flex: 1 1 auto; min-width: 0; }
  .antd .sp { justify-content: space-between; }
  .antd .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .antd .num { font-variant-numeric: tabular-nums; }
  .antd .t3 { color: var(--a-text-3); }
  .antd .t2 { color: var(--a-text-2); }
  .antd .sm { font-size: 12px; }
  .antd .xs { font-size: 11px; }
  .antd .b { font-weight: 600; }
  .antd .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .antd hr { border: 0; border-top: 1px solid var(--a-border-2); margin: 12px 0; }
  .antd .lbl { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--a-text-3); font-weight: 600; }

  .a-app { background: var(--a-bg-layout); border: 1px solid var(--a-border); border-radius: var(--a-radius-lg); overflow: hidden; box-shadow: var(--a-shadow); }
  .a-app-bar { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--a-bg); border-bottom: 1px solid var(--a-border-2); }
  .a-app-bar .dots { display: flex; gap: 5px; }
  .a-app-bar .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--a-fill-2); display: block; }
  .a-app-bar .url { flex: 1 1 auto; text-align: center; font-size: 11px; color: var(--a-text-3); }

  .a-avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--a-fill-2); color: var(--a-text-2); flex: 0 0 auto; border: 1px solid var(--a-border-2); }
  .a-avatar.lg { width: 44px; height: 44px; font-size: 15px; }
  .a-avatar.sm { width: 24px; height: 24px; font-size: 10px; }
  .a-avatar.xs { width: 20px; height: 20px; font-size: 9px; }
  .a-avatar.b1 { background: #e6f4ff; color: #0958d9; border-color: #91caff; }
  .a-avatar.b2 { background: #f9f0ff; color: #531dab; border-color: #d3adf7; }
  .a-avatar.b3 { background: #e6fffb; color: #08979c; border-color: #87e8de; }
  .a-avatar.b4 { background: #fff7e6; color: #d46b08; border-color: #ffd591; }
  .a-avatar.b5 { background: #fff0f6; color: #c41d7f; border-color: #ffadd2; }
  .a-stackav { display: flex; }
  .a-stackav .a-avatar + .a-avatar { margin-inline-start: -8px; box-shadow: 0 0 0 2px var(--a-bg); }

  .a-seg { display: inline-flex; background: var(--a-fill-3); border-radius: var(--a-radius); padding: 2px; gap: 2px; }
  .a-seg span { padding: 3px 10px; border-radius: 4px; font-size: 12px; color: var(--a-text-2); white-space: nowrap; }
  .a-seg span.on { background: var(--a-bg); color: var(--a-text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.06); font-weight: 500; }

  .a-input { display: flex; align-items: center; gap: 7px; height: var(--a-h); padding: 0 11px; border: 1px solid var(--a-border); border-radius: var(--a-radius); background: var(--a-bg); font-size: 14px; color: var(--a-text-3); }
  .a-input.focus { border-color: var(--a-primary); box-shadow: 0 0 0 2px rgb(5 145 255 / 0.1); }
  .a-input.lg { height: 40px; font-size: 15px; }
  .a-input .val { color: var(--a-text); }
  .a-caret { display: inline-block; width: 1px; height: 15px; background: var(--a-text); vertical-align: -2px; }

  .a-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--a-border-2); }
  .a-tabs span { padding: 9px 14px; font-size: 13px; color: var(--a-text-2); border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .a-tabs span.on { color: var(--a-primary); border-bottom-color: var(--a-primary); font-weight: 500; }

  .a-prog { height: 6px; border-radius: 3px; background: var(--a-fill-2); overflow: hidden; }
  .a-prog i { display: block; height: 100%; background: var(--a-primary); border-radius: 3px; }
  .a-prog i.ok { background: var(--a-success); } .a-prog i.warn { background: var(--a-warning); } .a-prog i.err { background: var(--a-error); }
  .a-prog.thin { height: 4px; }

  /* Data table --------------------------------------------------------- */
  .a-tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 0; }
  .a-tbl th { text-align: start; font-weight: 600; font-size: 12px; color: var(--a-text-2); background: var(--a-fill-3); padding: 8px 10px; border-bottom: 1px solid var(--a-border-2); white-space: nowrap; position: sticky; top: 0; }
  .a-tbl td { padding: 9px 10px; border-bottom: 1px solid var(--a-border-2); color: var(--a-text); vertical-align: middle; }
  .a-tbl tr:last-child td { border-bottom: 0; }
  .a-tbl tr.sel td { background: var(--a-primary-bg); }
  .a-tbl tr.hov td { background: var(--a-fill-3); }
  .a-tbl td.r, .a-tbl th.r { text-align: end; }
  .a-tbl td.c, .a-tbl th.c { text-align: center; }
  .a-tbl .stat { border-inline-start: 3px solid transparent; }
  .a-tbl .stat.crit { border-inline-start-color: var(--a-error); }
  .a-tbl .stat.warn { border-inline-start-color: var(--a-warning); }
  .a-tbl .stat.ok { border-inline-start-color: var(--a-success); }
  .a-tbl .stat.info { border-inline-start-color: var(--a-primary); }
  .a-scroll { overflow: auto; }

  /* Clinical status chip system --------------------------------------- */
  .cs { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 7px 0 5px; border-radius: var(--a-radius-sm); font-size: 11.5px; font-weight: 500; border: 1px solid; white-space: nowrap; }
  .cs .gl { width: 8px; height: 8px; flex: 0 0 auto; }
  .cs-crit { border-color: #ffa39e; background: #fff1f0; color: #a8071a; }
  .cs-warn { border-color: #ffd591; background: #fff7e6; color: #ad4e00; }
  .cs-cau  { border-color: #ffe58f; background: #fffbe6; color: #874d00; }
  .cs-ok   { border-color: #b7eb8f; background: #f6ffed; color: #237804; }
  .cs-info { border-color: #91caff; background: #e6f4ff; color: #0958d9; }
  .cs-none { border-color: #d9d9d9; background: #fafafa; color: rgba(0,0,0,0.55); }
  .cs-unk  { border-color: #d9d9d9; background: repeating-linear-gradient(135deg, #fafafa 0 5px, #f0f0f0 5px 10px); color: rgba(0,0,0,0.6); }
  .cs-pend { border-color: #d3adf7; background: #f9f0ff; color: #531dab; }
  .cs-ai   { border-color: #87e8de; background: #e6fffb; color: #006d75; }
  .cs-rest { border-color: #adc6ff; background: #f0f5ff; color: #1d39c4; }
  .cs.lg { height: 26px; font-size: 12.5px; padding: 0 9px 0 6px; }
  .cs.sq { border-radius: 3px; }

  /* Shape glyphs — the second, non-colour cue on every status. */
  .gl-x { position: relative; }
  .gl-x::before, .gl-x::after { content: ""; position: absolute; inset-inline-start: 0; inset-block-start: 3px; width: 8px; height: 2px; background: currentColor; }
  .gl-x::before { transform: rotate(45deg); } .gl-x::after { transform: rotate(-45deg); }
  .gl-tri { width: 0 !important; height: 0 !important; border-inline: 4.5px solid transparent; border-block-end: 8px solid currentColor; }
  .gl-sq { background: currentColor; }
  .gl-dot { background: currentColor; border-radius: 50%; }
  .gl-ring { border: 2px solid currentColor; border-radius: 50%; }
  .gl-dash { height: 2px !important; background: currentColor; }
  .gl-hex { background: currentColor; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
  .gl-hatch { background: repeating-linear-gradient(45deg, currentColor 0 1.5px, transparent 1.5px 3.5px); border: 1px solid currentColor; }
  .gl-lock { border: 1.5px solid currentColor; border-radius: 1px; position: relative; }
  .gl-lock::before { content: ""; position: absolute; inset-inline-start: 1.5px; inset-block-start: -3px; width: 3px; height: 3px; border: 1.5px solid currentColor; border-block-end: 0; border-radius: 2px 2px 0 0; }

  /* Trend arrows / sparkline ------------------------------------------ */
  .spark { display: inline-block; vertical-align: middle; }
  .spark path { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .spark .area { fill: currentColor; opacity: 0.1; stroke: none; }
  .arrw { display: inline-block; width: 0; height: 0; }
  .arrw.up { border-inline: 4px solid transparent; border-block-end: 7px solid currentColor; }
  .arrw.dn { border-inline: 4px solid transparent; border-block-start: 7px solid currentColor; }
  .arrw.flat { width: 9px; height: 2px; background: currentColor; border: 0; }

  /* Reference range bar ------------------------------------------------ */
  .rng { position: relative; height: 26px; }
  .rng .track { position: absolute; inset-block-start: 9px; inset-inline: 0; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #fff1f0 0 12%, #fff7e6 12% 26%, #f6ffed 26% 74%, #fff7e6 74% 88%, #fff1f0 88% 100%); border: 1px solid var(--a-border-2); }
  .rng .band { position: absolute; inset-block-start: 9px; height: 8px; background: #d9f7be; border-inline: 1px solid #95de64; }
  .rng .pin { position: absolute; inset-block-start: 2px; width: 3px; height: 22px; border-radius: 2px; background: var(--a-text); transform: translateX(-50%); }
  .rng .pin.crit { background: var(--a-error); box-shadow: 0 0 0 3px rgb(255 77 79 / 0.15); }
  .rng .pin.warn { background: #d46b08; }
  .rng .pin.prev { background: var(--a-text-4); width: 2px; height: 16px; inset-block-start: 5px; }
  .rng .cap { position: absolute; inset-block-start: 20px; font-size: 10px; color: var(--a-text-3); transform: translateX(-50%); white-space: nowrap; }

  /* Chart frame -------------------------------------------------------- */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .gridline { stroke: var(--a-border-2); stroke-width: 1; }
  .chart .axis { stroke: var(--a-border); stroke-width: 1; }
  .chart .axlabel { font-size: 10px; fill: var(--a-text-3); font-family: ui-monospace, Menlo, monospace; }
  .chart .series { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chart .refband { fill: #f6ffed; }
  .chart .critband { fill: #fff1f0; }
  .chart .warnband { fill: #fffbe6; }
  .chart .pt { stroke: #fff; stroke-width: 1.5; }
  .chart .marker { stroke: var(--a-text-4); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .tip { fill: rgba(0,0,0,0.85); }
  .chart .tiptxt { fill: #fff; font-size: 11px; }

  /* Waveform ----------------------------------------------------------- */
  .wave { display: flex; align-items: center; gap: 2px; height: 34px; }
  .wave i { width: 3px; border-radius: 2px; background: var(--a-primary); display: block; opacity: 0.85; }
  .wave i.q { background: var(--a-border); }

  /* Panel / dock chrome ------------------------------------------------ */
  .dock { border: 1px solid var(--a-border); border-radius: var(--a-radius-lg) var(--a-radius-lg) 0 0; background: var(--a-bg); box-shadow: 0 -4px 16px rgb(0 0 0 / 0.09); overflow: hidden; }
  .dock-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; background: #fafafa; border-bottom: 1px solid var(--a-border-2); }
  .dock-h .ttl { font-size: 13px; font-weight: 600; flex: 1 1 auto; min-width: 0; }
  .win-btn { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; color: var(--a-text-3); }
  .win-btn:hover { background: var(--a-fill-3); }

  /* Kanban / column layout --------------------------------------------- */
  .cols { display: grid; gap: 10px; }
  .cols.c2 { grid-template-columns: 1fr 1fr; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c4 { grid-template-columns: repeat(4, 1fr); }
  .colh { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--a-text-3); font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--a-border-2); margin-bottom: 8px; display: flex; justify-content: space-between; }

  /* Generic tile ------------------------------------------------------- */
  .tile { border: 1px solid var(--a-border-2); border-radius: var(--a-radius); padding: 9px 11px; background: var(--a-bg); }
  .tile.sel { border-color: var(--a-primary); box-shadow: 0 0 0 2px rgb(5 145 255 / 0.09); }
  .tile.crit { border-color: var(--a-error-border); background: var(--a-error-bg); }
  .tile.warn { border-color: var(--a-warning-border); background: var(--a-warning-bg); }
  .tile.ok { border-color: var(--a-success-border); background: var(--a-success-bg); }
  .tile.ai { border-color: var(--a-cyan-border); background: linear-gradient(180deg, #f0fdfc, #fff); }
  .tile.ghost { border-style: dashed; background: transparent; color: var(--a-text-3); }
  .tile.flat { box-shadow: none; background: var(--a-fill-3); border-color: transparent; }

  /* Skeleton ----------------------------------------------------------- */
  .sk { background: linear-gradient(90deg, var(--a-fill-2) 25%, var(--a-fill-3) 37%, var(--a-fill-2) 63%); border-radius: 4px; display: block; }
  .sk.t { height: 12px; } .sk.t2 { height: 10px; } .sk.h { height: 18px; } .sk.av { border-radius: 50%; }

  /* Diff / draft review ------------------------------------------------ */
  .diff { font-size: 13px; line-height: 1.6; }
  .diff .ins { background: #f6ffed; border-block-end: 1px solid #b7eb8f; }
  .diff .del { background: #fff1f0; text-decoration: line-through; text-decoration-color: #ff7875; color: var(--a-text-3); }
  .diff .unv { background: #fffbe6; border-block-end: 1px dashed #ffd666; }
  .diff mark.cite { background: #e6f4ff; border-radius: 3px; padding: 0 3px; color: #0958d9; font-size: 11px; vertical-align: 1px; margin-inline-start: 2px; }

  /* Heatmap ------------------------------------------------------------ */
  .heat { display: grid; gap: 3px; }
  .heat i { aspect-ratio: 1; border-radius: 2px; display: block; border: 1px solid rgb(0 0 0 / 0.04); }
  .heat i.n0 { background: #f5f5f5; } .heat i.n1 { background: #d9f7be; } .heat i.n2 { background: #b7eb8f; }
  .heat i.n3 { background: #ffe58f; } .heat i.n4 { background: #ffbb96; } .heat i.n5 { background: #ff9c9c; }
  .heat i.gap { background: repeating-linear-gradient(45deg, #fafafa 0 3px, #eee 3px 6px); }

  /* Matrix cells (interaction grid) ------------------------------------ */
  .imx { border-collapse: separate; border-spacing: 2px; font-size: 11px; }
  .imx th { font-weight: 500; color: var(--a-text-2); font-size: 11px; padding: 3px 5px; background: none; border: 0; position: static; white-space: nowrap; }
  .imx th.v { writing-mode: vertical-rl; transform: rotate(180deg); text-align: start; height: 74px; padding: 0 3px; }
  .imx td { width: 30px; height: 30px; text-align: center; border-radius: 4px; background: var(--a-fill-3); color: var(--a-text-4); padding: 0; border: 1px solid transparent; }
  .imx td.x { background: transparent; }
  .imx td.s1 { background: #fffbe6; border-color: #ffe58f; color: #874d00; }
  .imx td.s2 { background: #fff7e6; border-color: #ffd591; color: #ad4e00; }
  .imx td.s3 { background: #fff1f0; border-color: #ffa39e; color: #a8071a; font-weight: 700; }
  .imx td.s0 { background: #fafafa; }

  /* Command palette ---------------------------------------------------- */
  .cmdk { background: var(--a-bg); border-radius: 10px; box-shadow: 0 12px 40px rgb(0 0 0 / 0.18); border: 1px solid var(--a-border-2); overflow: hidden; }
  .cmdk-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 13.5px; }
  .cmdk-row.on { background: var(--a-primary-bg); }
  .cmdk-row .kb { margin-inline-start: auto; }
  .kbd { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; padding: 1px 5px; border: 1px solid var(--a-border); border-block-end-width: 2px; border-radius: 4px; background: #fafafa; color: var(--a-text-2); }
  .cmdk-grp { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--a-text-3); font-weight: 600; padding: 9px 14px 4px; }

  /* Rail / stepper ------------------------------------------------------ */
  .steprail { display: grid; gap: 0; }
  .steprail .s { display: grid; grid-template-columns: 20px 1fr; gap: 10px; }
  .steprail .s .r { display: grid; grid-template-rows: auto 1fr; justify-items: center; }
  .steprail .s .d { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--a-border); background: var(--a-bg); margin-top: 3px; }
  .steprail .s .d.done { background: var(--a-success); border-color: var(--a-success); }
  .steprail .s .d.now { border-color: var(--a-primary); box-shadow: 0 0 0 3px rgb(5 145 255 / 0.13); }
  .steprail .s .d.blocked { border-color: var(--a-error); background: var(--a-error-bg); }
  .steprail .s .ln { width: 2px; background: var(--a-border-2); min-height: 12px; }
  .steprail .s:last-child .ln { display: none; }
  .steprail .s .c { padding-bottom: 12px; }
  .steprail .s:last-child .c { padding-bottom: 0; }

  /* Golden thread link -------------------------------------------------- */
  .thread { border-inline-start: 2px solid var(--a-warning); padding-inline-start: 10px; }
  .thread.ok { border-inline-start-color: var(--a-success); }
  .thread.miss { border-inline-start-color: var(--a-error); border-inline-start-style: dashed; }

  /* Small caption under a mockup band ----------------------------------- */
  .bandcap { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--a-text-3); font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .bandcap::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--a-border-2); }
  .band + .band { margin-top: 20px; }

  .statesgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px; }
  .statecell { border: 1px solid var(--a-border-2); border-radius: var(--a-radius); padding: 10px; background: var(--a-bg); }
  .statecell .nm { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--a-text-3); font-weight: 600; margin-bottom: 7px; }

  @media (max-width: 720px) {
    .cols.c3, .cols.c4 { grid-template-columns: 1fr; }
    .cols.c2 { grid-template-columns: 1fr; }
    .idx { columns: 1; }
    .spec { position: static; }
  }

  /* Icons default to block in the base sheet, which orphans them onto their own
     line when they appear inside running text. Flex parents blockify anyway,
     so inline-block is safe everywhere and correct inside a sentence. */
  .antd .i, .antd .i-14, .antd .i-18, .antd .i-20 { display: inline-block; vertical-align: -0.16em; }

  /* Matrix — dividers at the set's medians, labels pinned to the corners. */
  .matrix { padding: 2.2rem 3.4rem 3.2rem 3.4rem; }
  .mx-plot { height: 600px; }
  .mx-div { position: absolute; background: var(--rule-2); }
  .mx-div.v { inset-block: 0; width: 1px; border-inline-start: 1px dashed var(--rule-2); background: none; }
  .mx-div.h { inset-inline: 0; height: 1px; border-block-start: 1px dashed var(--rule-2); background: none; }
  .mx-lab {
    position: absolute; font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; opacity: 0.85;
  }
  .mx-lab.tl { inset-block-start: -1.5rem; inset-inline-start: 0; }
  .mx-lab.tr { inset-block-start: -1.5rem; inset-inline-end: 0; color: var(--accent-ink); }
  .mx-lab.bl { inset-block-end: -1.5rem; inset-inline-start: 0; }
  .mx-lab.br { inset-block-end: -1.5rem; inset-inline-end: 0; }
  .mx-dot { z-index: 2; box-shadow: 0 0 0 1.5px var(--surface); }
  .mx-dot::after { font-size: 0.58rem; color: var(--muted); }
  .matrix .mx-ax.y { inset-inline-start: 1rem; }

  /* Matrix geometry corrections: room for the corner labels and the axis captions,
     and a vertical y-axis title that is actually centred on the plot. */
  .matrix { padding: 2.6rem 4.2rem 4.4rem 3.8rem; }
  .mx-lab.bl, .mx-lab.br { inset-block-end: -2.7rem; }
  .matrix .mx-ax.x { margin-top: 3.1rem; }
  .matrix .mx-ax.y {
    inset-inline-start: 1.1rem; inset-block-start: 0; inset-block-end: 0;
    transform: none; writing-mode: vertical-rl; rotate: 180deg;
    display: grid; place-items: center; height: auto;
  }
  @media (max-width: 760px) {
    .matrix { padding: 2.6rem 1.2rem 5.4rem 2.6rem; }
    .mx-lab { font-size: 0.52rem; }
    .mx-lab.tr, .mx-lab.br { inset-inline-end: auto; inset-inline-start: 0; }
    .mx-lab.tl, .mx-lab.tr { inset-block-start: -2.6rem; }
    .mx-lab.tr { inset-block-start: -1.4rem; }
    .mx-lab.bl { inset-block-end: -2.7rem; }
    .mx-lab.br { inset-block-end: -3.9rem; }
  }

  /* `inset-block-*` resolves against the ELEMENT's own writing mode, so on a
     vertical-rl label it stretches horizontally. Physical properties instead. */
  .matrix .mx-ax.y {
    inset: 0 auto 0 1.1rem; width: auto; height: auto;
    inset-inline: auto; inset-block: auto;
    top: 2.6rem; bottom: 4.4rem; left: 1.1rem; right: auto;
  }

  /* A long unbreakable API signature in the heading was forcing the whole page
     wider than the viewport at 375px. Let the track shrink and the token break. */
  .comp-head { grid-template-columns: auto minmax(0, 1fr); }
  .comp-head > div { min-width: 0; }
  .comp-head h3 { overflow-wrap: anywhere; }
  .comp-head h3 .api { display: inline-block; overflow-wrap: anywhere; }
  .comp-cols, .comp-body, .blk { min-width: 0; }
  .blk p, .blk li { overflow-wrap: anywhere; }
  .spec dd { overflow-wrap: anywhere; }

  /* Auto table layout was giving the interaction matrix's text column all the
     slack, stranding the cells at the far right. Size the table to its content. */
  .imx { width: max-content; }
  .imx th:first-child { text-align: end; padding-inline-end: 8px; }

  /* Identifier lines under a name in a grid cell should not wrap mid-identifier. */
  .a-tbl .xs.mono, .a-tbl .mono.xs { white-space: nowrap; }

  /* ==================================================================== */
  /*  OXYGEN DESIGN SYSTEM v2                                             */
  /*  Loaded after base.css + extra.css. Everything below either defines  */
  /*  a token or spends one. No literal outside this file is permitted    */
  /*  in a component rule — that is the whole point of the rewrite.       */
  /* ==================================================================== */

  .antd, .ox {
    /* --- space: 4px grid, one half-step ------------------------------ */
    --sp-0: 0px;   --sp-h: 2px;  --sp-1: 4px;  --sp-2: 8px;   --sp-3: 12px;
    --sp-4: 16px;  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;  --sp-10: 40px;
    --sp-12: 48px; --sp-16: 64px;

    /* --- control heights: one ladder, density switches the rung ------ */
    --ctl-xs: 20px; --ctl-sm: 24px; --ctl-md: 28px; --ctl-lg: 32px; --ctl-xl: 40px;
    --row-h: 32px;

    /* --- radius: tight on controls, generous on containers ----------- */
    --r-xs: 2px; --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-full: 999px;

    /* --- type: size / line / weight / tracking, all named ------------ */
    --fs-micro: 10.5px; --lh-micro: 1.35;
    --fs-xs:    11.5px; --lh-xs:    1.4;
    --fs-sm:    12.5px; --lh-sm:    1.45;
    --fs-md:    13.5px; --lh-md:    1.5;
    --fs-lg:    15px;   --lh-lg:    1.45;
    --fs-xl:    17px;   --lh-xl:    1.35;
    --fs-2xl:   21px;   --lh-2xl:   1.2;
    --fs-3xl:   28px;   --lh-3xl:   1.1;
    --tr-label: 0.075em;
    --tr-tight: -0.014em;
    --tr-display: -0.022em;
    --fw-r: 400; --fw-m: 500; --fw-sb: 600; --fw-b: 680;

    --font-ui: "Inter var", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
               "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-num: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;

    /* --- motion ------------------------------------------------------ */
    --dur-press: 90ms; --dur-micro: 140ms; --dur-state: 200ms; --dur-layout: 280ms;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-both: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-exit: cubic-bezier(0.4, 0, 1, 1);
  }

  /* ---- LIGHT ------------------------------------------------------- */
  .antd, .ox {
    --ink:    #0A1514;
    --ink-2:  #384A46;
    --ink-3:  #5C6D69;   /* tertiary text  - 5.4:1 on surface, 4.9:1 on sunken */
    --ink-4:  #63736E;   /* micro labels   - 4.5:1 on SUNKEN, the harder ground */
    --ink-5:  #A3B0AC;   /* NON-TEXT only  - dividers, disabled glyphs, decorative dots */

    --bg:        #F7F9F9;
    --surface:   #FFFFFF;
    --sunken:    #F1F4F4;
    --raised:    #FFFFFF;
    --overlay:   #FFFFFF;

    --line:      #E4EAE8;   /* hairline — the primary structural device */
    --line-2:    #D2DBD8;   /* stronger divider */
    --line-3:    #849993;   /* field border - 3.02:1, meets WCAG 1.4.11 */

    --accent:        #0E7C66;
    --accent-hover:  #0B6754;
    --accent-press:  #085243;
    --accent-soft:   #E4F3EF;
    --accent-line:   #9FD3C6;
    --accent-ink:    #075244;
    --on-accent:     #FFFFFF;
    --ring:          rgb(14 124 102 / 0.32);

    --crit:      #B42318; --crit-soft: #FEF3F2; --crit-line: #F5B5AE; --crit-ink: #912018;
    --warn:      #B54708; --warn-soft: #FFFAEB; --warn-line: #F5CE7A; --warn-ink: #93370D;
    --ok:        #067647; --ok-soft:   #ECFDF3; --ok-line:   #9BE5BC; --ok-ink:   #05603A;
    --info:      #175CD3; --info-soft: #EFF8FF; --info-line: #A9D4FB; --info-ink: #1849A9;
    --ai:        #5B44BE; --ai-soft:   #F5F3FF; --ai-line:   #CFC6F6; --ai-ink:   #4A35A0;
    --rest:      #3538CD; --rest-soft: #EEF4FF; --rest-line: #BFCEFB; --rest-ink: #2D31A6;

    --shadow-ink: 10 21 20;
    --e-1: 0 1px 2px -1px rgb(var(--shadow-ink) / 0.10);
    --e-2: 0 4px 12px -4px rgb(var(--shadow-ink) / 0.14), 0 1px 2px -1px rgb(var(--shadow-ink) / 0.06);
    --e-3: 0 14px 34px -10px rgb(var(--shadow-ink) / 0.20), 0 3px 8px -3px rgb(var(--shadow-ink) / 0.08);
    --hair: inset 0 0 0 1px var(--line);
    color-scheme: light;
  }

  /* ---- DARK -------------------------------------------------------- */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .antd, :root:not([data-theme="light"]) .ox {
      --ink:    #E8F0EE;
      --ink-2:  #B6C6C2;
      --ink-3:  #8A9C98;
      --ink-4:  #70837E;
      --ink-5:  #4B5B57;

      --bg:      #080F0E;
      --surface: #0E1817;
      --sunken:  #0A1211;
      --raised:  #14201E;
      --overlay: #172522;

      --line:    #1E2C2A;
      --line-2:  #2A3B38;
      --line-3:  #506864;

      --accent:       #34C6A4;
      --accent-hover: #4FD6B6;
      --accent-press: #29A98B;
      --accent-soft:  #0C2A25;
      --accent-line:  #1E5B4D;
      --accent-ink:   #7FE3CB;
      --on-accent:    #04201A;
      --ring:         rgb(52 198 164 / 0.36);

      --crit: #F97066; --crit-soft: #2A1210; --crit-line: #6B231C; --crit-ink: #FDA29B;
      --warn: #F5A524; --warn-soft: #2A1E08; --warn-line: #6B4A11; --warn-ink: #FDC873;
      --ok:   #47C98B; --ok-soft:   #08241A; --ok-line:   #14543A; --ok-ink:   #83E0B4;
      --info: #5AA0F5; --info-soft: #0A1B2E; --info-line: #1B416E; --info-ink: #9CC9FB;
      --ai:   #A48CF0; --ai-soft:   #1A1330; --ai-line:   #3B2C6B; --ai-ink:   #C8B9F8;
      --rest: #8AA0FA; --rest-soft: #121734; --rest-line: #2C3878; --rest-ink: #B6C4FC;

      --shadow-ink: 0 0 0;
      --e-1: 0 1px 2px -1px rgb(0 0 0 / 0.6);
      --e-2: 0 4px 14px -4px rgb(0 0 0 / 0.7), 0 1px 2px -1px rgb(0 0 0 / 0.5);
      --e-3: 0 16px 40px -12px rgb(0 0 0 / 0.8), 0 3px 8px -3px rgb(0 0 0 / 0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] .antd, :root[data-theme="dark"] .ox {
    --ink: #E8F0EE; --ink-2: #B6C6C2; --ink-3: #8A9C98; --ink-4: #70837E; --ink-5: #4B5B57;
    --bg: #080F0E; --surface: #0E1817; --sunken: #0A1211; --raised: #14201E; --overlay: #172522;
    --line: #1E2C2A; --line-2: #2A3B38; --line-3: #506864;
    --accent: #34C6A4; --accent-hover: #4FD6B6; --accent-press: #29A98B; --accent-soft: #0C2A25;
    --accent-line: #1E5B4D; --accent-ink: #7FE3CB; --on-accent: #04201A; --ring: rgb(52 198 164 / 0.36);
    --crit: #F97066; --crit-soft: #2A1210; --crit-line: #6B231C; --crit-ink: #FDA29B;
    --warn: #F5A524; --warn-soft: #2A1E08; --warn-line: #6B4A11; --warn-ink: #FDC873;
    --ok: #47C98B; --ok-soft: #08241A; --ok-line: #14543A; --ok-ink: #83E0B4;
    --info: #5AA0F5; --info-soft: #0A1B2E; --info-line: #1B416E; --info-ink: #9CC9FB;
    --ai: #A48CF0; --ai-soft: #1A1330; --ai-line: #3B2C6B; --ai-ink: #C8B9F8;
    --rest: #8AA0FA; --rest-soft: #121734; --rest-line: #2C3878; --rest-ink: #B6C4FC;
    --shadow-ink: 0 0 0;
    --e-1: 0 1px 2px -1px rgb(0 0 0 / 0.6);
    --e-2: 0 4px 14px -4px rgb(0 0 0 / 0.7), 0 1px 2px -1px rgb(0 0 0 / 0.5);
    --e-3: 0 16px 40px -12px rgb(0 0 0 / 0.8), 0 3px 8px -3px rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }

  /* ==================================================================== */
  /*  COMPATIBILITY REMAP                                                 */
  /*  1,985 inline styles and 159 classes still reference antd's `--a-*`. */
  /*  Re-point them at Oxygen tokens: the whole catalogue re-themes with  */
  /*  no markup change, which is the test of whether this is a system.    */
  /* ==================================================================== */
  .antd {
    --a-primary: var(--accent);      --a-primary-bg: var(--accent-soft);  --a-primary-border: var(--accent-line);
    --a-success: var(--ok);          --a-success-bg: var(--ok-soft);      --a-success-border: var(--ok-line);
    --a-warning: var(--warn);        --a-warning-bg: var(--warn-soft);    --a-warning-border: var(--warn-line);
    --a-error:   var(--crit);        --a-error-bg:   var(--crit-soft);    --a-error-border:   var(--crit-line);
    --a-purple:  var(--ai);          --a-purple-bg:  var(--ai-soft);      --a-purple-border:  var(--ai-line);
    --a-cyan:    var(--info);        --a-cyan-bg:    var(--info-soft);    --a-cyan-border:    var(--info-line);
    --a-magenta: var(--ai);          --a-magenta-bg: var(--ai-soft);      --a-magenta-border: var(--ai-line);
    --a-text: var(--ink); --a-text-2: var(--ink-2); --a-text-3: var(--ink-3); --a-text-4: var(--ink-4);
    --a-border: var(--line-2); --a-border-2: var(--line);
    --a-bg: var(--surface); --a-bg-layout: var(--bg);
    --a-fill-3: var(--sunken); --a-fill-2: var(--sunken);
    --a-radius: var(--r-sm); --a-radius-lg: var(--r-lg); --a-radius-sm: var(--r-xs);
    --a-h: var(--ctl-md); --a-h-sm: var(--ctl-sm);
    --a-shadow: var(--e-2);
    font-family: var(--font-ui);
    font-size: var(--fs-md);
    line-height: var(--lh-md);
    letter-spacing: var(--tr-tight);
    color: var(--ink);
    font-feature-settings: "cv05" 1, "ss01" 1, "calt" 1;
    -webkit-font-smoothing: antialiased;
  }

  /* ==================================================================== */
  /*  SURFACES — defined by hairline, not by drop shadow                  */
  /* ==================================================================== */
  .antd .a-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--e-1);
    /* `overflow: clip` used to live here, to keep the head and foot inside the
       rounded corners. It also sliced 300px off every calendar that opened
       inside a card. The head and foot carry their own radii instead, which
       costs two rules and lets a popover leave the card it belongs to. */
  }
  .antd .a-card > .a-card-head:first-child {
    border-start-start-radius: var(--r-lg);
    border-start-end-radius: var(--r-lg);
  }
  .antd .a-card > .a-card-foot:last-child {
    border-end-start-radius: var(--r-lg);
    border-end-end-radius: var(--r-lg);
  }

  /* A stage scrolls so a wide figure can be panned. `overflow-x: auto` forces
     a computed `overflow-y: auto` — the two cannot disagree — so a scrolling
     stage clips vertically whether it wants to or not, and no rule on the
     panel can escape it. While a popover is actually open, the stage stops
     scrolling; `:has()` makes that exactly as long as the popover exists. */
  .antd .a-card:has(.pop),
  .stage:has(.pop) {
    overflow: visible;
  }
  .antd .a-card-head {
    padding: var(--sp-3) var(--sp-4);
    border-bottom: 1px solid var(--line);
    background: linear-gradient(var(--sunken), var(--sunken)) padding-box;
    gap: var(--sp-3);
  }
  .antd .a-card-title {
    font-size: var(--fs-lg); font-weight: var(--fw-sb);
    line-height: var(--lh-lg); letter-spacing: var(--tr-tight); color: var(--ink);
  }
  .antd .a-card-sub { font-size: var(--fs-xs); color: var(--ink-3); margin-top: var(--sp-h); letter-spacing: 0; }
  .antd .a-card-body { padding: var(--sp-4); }
  .antd .a-card-body.flush { padding: 0; }
  .antd .a-card-foot {
    padding: var(--sp-2) var(--sp-4);
    border-top: 1px solid var(--line);
    background: var(--sunken);
    font-size: var(--fs-xs); color: var(--ink-3); gap: var(--sp-3);
  }

  .antd .tile {
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: var(--sp-3);
    background: var(--surface);
    transition: border-color var(--dur-micro) var(--ease-out),
                box-shadow var(--dur-micro) var(--ease-out),
                background-color var(--dur-micro) var(--ease-out);
  }
  .antd .tile.flat { background: var(--sunken); border-color: transparent; box-shadow: none; }
  .antd .tile.ghost { border-style: dashed; border-color: var(--line-2); background: transparent; color: var(--ink-3); }
  .antd .tile.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .antd .tile.crit { border-color: var(--crit-line); background: var(--crit-soft); }
  .antd .tile.warn { border-color: var(--warn-line); background: var(--warn-soft); }
  .antd .tile.ok   { border-color: var(--ok-line);   background: var(--ok-soft); }
  .antd .tile.ai   { border-color: var(--ai-line);   background: var(--ai-soft); }

  .antd .a-app {
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: var(--r-lg);
    box-shadow: var(--e-2);
    overflow: clip;
  }
  .antd .a-app-bar {
    padding: var(--sp-2) var(--sp-3);
    background: var(--sunken);
    border-bottom: 1px solid var(--line);
    gap: var(--sp-2);
  }
  .antd .a-app-bar .dots i { width: 8px; height: 8px; background: var(--line-2); }
  .antd .a-app-bar .url { font-size: var(--fs-micro); color: var(--ink-4); letter-spacing: 0; }

  /* ==================================================================== */
  /*  CONTROLS                                                            */
  /* ==================================================================== */
  .antd .a-btn {
    height: var(--ctl-md);
    padding: 0 var(--sp-3);
    gap: var(--sp-1);
    border: 1px solid var(--line-2);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink-2);
    font-size: var(--fs-sm);
    font-weight: var(--fw-m);
    letter-spacing: 0;
    cursor: default;
    transition: background-color var(--dur-micro) var(--ease-out),
                border-color var(--dur-micro) var(--ease-out),
                color var(--dur-micro) var(--ease-out),
                box-shadow var(--dur-micro) var(--ease-out),
                translate var(--dur-press) var(--ease-out);
  }
  .antd .a-btn:hover { background: var(--sunken); border-color: var(--line-3); color: var(--ink); }
  .antd .a-btn:active { translate: 0 1px; }
  .antd .a-btn.primary {
    background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: var(--fw-m);
    box-shadow: 0 1px 2px -1px rgb(var(--shadow-ink) / 0.3), inset 0 1px 0 0 rgb(255 255 255 / 0.12);
  }
  .antd .a-btn.primary:hover { background: var(--accent-hover); }
  .antd .a-btn.primary:active { background: var(--accent-press); }
  .antd .a-btn.text { border-color: transparent; background: transparent; color: var(--ink-3); }
  .antd .a-btn.text:hover { background: var(--sunken); color: var(--ink); }
  .antd .a-btn.link {
    border-color: transparent; background: none; color: var(--accent);
    padding: 0; height: auto; font-weight: var(--fw-m);
    text-underline-offset: 2px;
  }
  .antd .a-btn.link:hover { text-decoration: underline; background: none; }
  .antd .a-btn.sm { height: var(--ctl-sm); padding: 0 var(--sp-2); font-size: var(--fs-xs); }
  .antd .a-btn.on {
    color: var(--accent-ink); border-color: var(--accent-line); background: var(--accent-soft);
  }
  .antd .a-btn[aria-disabled="true"], .antd .a-btn.disabled {
    color: var(--ink-4); background: var(--sunken); border-color: var(--line); pointer-events: none;
  }
  .antd .a-btn:focus-visible,
  .antd .win-btn:focus-visible,
  .antd .a-seg span:focus-visible {
    outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring);
  }

  .antd .a-input {
    height: var(--ctl-lg);
    padding: 0 var(--sp-3);
    gap: var(--sp-2);
    border: 1px solid var(--line-3);
    border-radius: var(--r-sm);
    background: var(--surface);
    font-size: var(--fs-md);
    color: var(--ink-4);
    transition: border-color var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
  }
  .antd .a-input:hover { border-color: var(--ink-4); }
  .antd .a-input.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .antd .a-input .val { color: var(--ink); }
  .antd .a-caret {
    width: 1.5px; height: 1.05em; background: var(--accent); vertical-align: -0.18em;
    animation: ox-caret 1.05s steps(1) infinite;
  }
  @keyframes ox-caret { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }

  .antd .a-seg {
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 2px; gap: 2px;
  }
  .antd .a-seg span {
    padding: 0 var(--sp-2);
    height: calc(var(--ctl-md) - 6px);
    display: inline-flex; align-items: center;
    border-radius: 2px;
    font-size: var(--fs-xs); font-weight: var(--fw-m); color: var(--ink-3);
    transition: color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
  }
  .antd .a-seg span:hover { color: var(--ink); }
  .antd .a-seg span.on {
    background: var(--surface); color: var(--ink); box-shadow: var(--e-1), var(--hair);
  }

  .antd .win-btn {
    width: var(--ctl-sm); height: var(--ctl-sm); border-radius: var(--r-xs); color: var(--ink-4);
    transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
  }
  .antd .win-btn:hover { background: var(--sunken); color: var(--ink); }

  .antd .kbd, .kbd {
    font-family: var(--font-num); font-size: var(--fs-micro); font-weight: var(--fw-m);
    min-width: 18px; height: 18px; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: var(--r-xs);
    background: var(--surface); color: var(--ink-3); letter-spacing: 0;
  }

  /* ==================================================================== */
  /*  TAGS, CHIPS, STATUS                                                 */
  /* ==================================================================== */
  .antd .a-tag {
    height: var(--ctl-xs); padding: 0 var(--sp-1); gap: var(--sp-1);
    font-size: var(--fs-micro); font-weight: var(--fw-m); letter-spacing: 0;
    border: 1px solid var(--line); border-radius: var(--r-xs);
    background: var(--sunken); color: var(--ink-3);
  }
  .antd .a-tag.blue    { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
  .antd .a-tag.green   { border-color: var(--ok-line);     background: var(--ok-soft);     color: var(--ok-ink); }
  .antd .a-tag.gold    { border-color: var(--warn-line);   background: var(--warn-soft);   color: var(--warn-ink); }
  .antd .a-tag.red     { border-color: var(--crit-line);   background: var(--crit-soft);   color: var(--crit-ink); }
  .antd .a-tag.purple  { border-color: var(--ai-line);     background: var(--ai-soft);     color: var(--ai-ink); }
  .antd .a-tag.cyan    { border-color: var(--info-line);   background: var(--info-soft);   color: var(--info-ink); }
  .antd .a-tag.magenta { border-color: var(--ai-line);     background: var(--ai-soft);     color: var(--ai-ink); }
  .antd .a-tag.plain   { border-color: var(--line); background: transparent; color: var(--ink-4); }

  /* The status chip: hue + shape + word, on one geometry. */
  .antd .cs, .cs {
    height: var(--ctl-sm); padding: 0 var(--sp-2) 0 var(--sp-1); gap: var(--sp-1);
    border-radius: var(--r-xs);
