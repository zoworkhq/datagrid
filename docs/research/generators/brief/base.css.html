    font-size: var(--fs-xs); font-weight: var(--fw-m); letter-spacing: 0;
    border: 1px solid;
  }
  .antd .cs.lg { height: var(--ctl-md); font-size: var(--fs-sm); padding: 0 var(--sp-2); }
  .antd .cs-crit { border-color: var(--crit-line); background: var(--crit-soft); color: var(--crit-ink); }
  .antd .cs-warn { border-color: var(--warn-line); background: var(--warn-soft); color: var(--warn-ink); }
  .antd .cs-cau  { border-color: var(--warn-line); background: var(--warn-soft); color: var(--warn-ink); opacity: .92; }
  .antd .cs-ok   { border-color: var(--ok-line);   background: var(--ok-soft);   color: var(--ok-ink); }
  .antd .cs-info { border-color: var(--info-line); background: var(--info-soft); color: var(--info-ink); }
  .antd .cs-pend { border-color: var(--ai-line);   background: var(--ai-soft);   color: var(--ai-ink); }
  .antd .cs-ai   { border-color: var(--info-line); background: var(--info-soft); color: var(--info-ink); }
  .antd .cs-rest { border-color: var(--rest-line); background: var(--rest-soft); color: var(--rest-ink); }
  .antd .cs-none { border-color: var(--line);      background: var(--sunken);    color: var(--ink-3); }
  .antd .cs-unk  {
    border-color: var(--line-2); color: var(--ink-2);
    background: repeating-linear-gradient(135deg,
      var(--sunken) 0 4px, color-mix(in oklab, var(--ink) 7%, var(--sunken)) 4px 8px);
  }

  /* ==================================================================== */
  /*  TABLES — rules, not boxes                                           */
  /* ==================================================================== */
  .antd .a-tbl { font-size: var(--fs-sm); }
  .antd .a-tbl th {
    font-size: var(--fs-micro); font-weight: var(--fw-sb); letter-spacing: var(--tr-label);
    text-transform: uppercase; color: var(--ink-4);
    background: var(--sunken); border-bottom: 1px solid var(--line-2);
    padding: var(--sp-2) var(--sp-3); height: var(--ctl-lg);
  }
  .antd .a-tbl td {
    padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--line); color: var(--ink);
    line-height: var(--lh-sm);
  }
  .antd .a-tbl tbody tr { transition: background-color var(--dur-micro) var(--ease-out); }
  .antd .a-tbl tbody tr:hover td { background: color-mix(in oklab, var(--accent) 4%, transparent); }
  .antd .a-tbl tr.sel td { background: var(--accent-soft); }
  .antd .a-tbl tr.hov td { background: var(--sunken); }
  .antd .a-tbl .stat { border-inline-start: 2px solid transparent; }
  .antd .a-tbl .stat.crit { border-inline-start-color: var(--crit); }
  .antd .a-tbl .stat.warn { border-inline-start-color: var(--warn); }
  .antd .a-tbl .stat.ok   { border-inline-start-color: var(--ok); }
  .antd .a-tbl .stat.info { border-inline-start-color: var(--info); }

  /* ==================================================================== */
  /*  FEEDBACK                                                            */
  /* ==================================================================== */
  .antd .a-alert {
    padding: var(--sp-2) var(--sp-3); gap: var(--sp-2);
    border-radius: var(--r-md); font-size: var(--fs-sm); line-height: var(--lh-sm);
    border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--ink);
  }
  .antd .a-alert.warning { border-color: var(--warn-line); background: var(--warn-soft); }
  .antd .a-alert.error   { border-color: var(--crit-line); background: var(--crit-soft); }
  .antd .a-alert .ic { margin-top: 1px; }
  .antd .a-alert.error   .ic { color: var(--crit); }
  .antd .a-alert.warning .ic { color: var(--warn); }
  .antd .a-alert .ic     { color: var(--accent); }

  .antd .a-prog {
    height: 5px; border-radius: var(--r-full);
    background: color-mix(in oklab, var(--ink) 9%, transparent);
  }
  .antd .a-prog.thin { height: 3px; }
  .antd .a-prog i {
    background: var(--accent); border-radius: inherit;
    transition: width var(--dur-layout) var(--ease-out);
  }
  .antd .a-prog i.ok { background: var(--ok); } .antd .a-prog i.warn { background: var(--warn); }
  .antd .a-prog i.err { background: var(--crit); }

  .antd .a-avatar {
    border-radius: var(--r-full); border: 1px solid var(--line);
    background: var(--sunken); color: var(--ink-3);
    font-size: var(--fs-xs); font-weight: var(--fw-sb); letter-spacing: 0;
    width: var(--ctl-lg); height: var(--ctl-lg);
  }
  .antd .a-avatar.lg { width: var(--ctl-xl); height: var(--ctl-xl); font-size: var(--fs-md); }
  .antd .a-avatar.sm { width: var(--ctl-sm); height: var(--ctl-sm); font-size: var(--fs-micro); }
  .antd .a-avatar.xs { width: var(--ctl-xs); height: var(--ctl-xs); font-size: 9px; }
  .antd .a-avatar.b1 { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }
  .antd .a-avatar.b2 { background: var(--ai-soft);     color: var(--ai-ink);     border-color: var(--ai-line); }
  .antd .a-avatar.b3 { background: var(--info-soft);   color: var(--info-ink);   border-color: var(--info-line); }
  .antd .a-avatar.b4 { background: var(--warn-soft);   color: var(--warn-ink);   border-color: var(--warn-line); }
  .antd .a-avatar.b5 { background: var(--rest-soft);   color: var(--rest-ink);   border-color: var(--rest-line); }

  /* ==================================================================== */
  /*  TYPE UTILITIES — replacing inline font-size literals                */
  /* ==================================================================== */
  .antd .lbl, .antd .bandcap, .antd .colh, .antd .cmdk-grp, .antd .nm {
    font-size: var(--fs-micro); font-weight: var(--fw-sb);
    letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--ink-4);
  }
  .antd .xs { font-size: var(--fs-xs);  line-height: var(--lh-xs); }
  .antd .sm { font-size: var(--fs-sm);  line-height: var(--lh-sm); }
  .antd .b  { font-weight: var(--fw-sb); color: var(--ink); }
  .antd .t2 { color: var(--ink-2); } .antd .t3 { color: var(--ink-3); }
  .antd .mono, .antd .num {
    font-family: var(--font-num); font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em; font-feature-settings: "zero" 1;
  }
  .antd code {
    background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-xs);
    padding: 1px 4px; font-size: var(--fs-xs); font-family: var(--font-num); color: var(--ink-2);
  }
  .antd hr { border-top-color: var(--line); margin: var(--sp-3) 0; }
  .antd .row  { gap: var(--sp-2); }
  .antd .col  { gap: var(--sp-2); }

  /* ==================================================================== */
  /*  MOTION LAYER                                                        */
  /* ==================================================================== */
  @keyframes ox-pulse-ring {
    0%   { box-shadow: 0 0 0 0 color-mix(in oklab, var(--crit) 45%, transparent); }
    70%  { box-shadow: 0 0 0 7px color-mix(in oklab, var(--crit) 0%, transparent); }
    100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--crit) 0%, transparent); }
  }
  @keyframes ox-shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  @keyframes ox-wave    { 0%, 100% { transform: scaleY(0.35) } 50% { transform: scaleY(1) } }
  @keyframes ox-stream  { from { opacity: 0; transform: translateY(2px) } to { opacity: 1; transform: none } }

  .antd .sk {
    background: linear-gradient(100deg,
      var(--sunken) 30%,
      color-mix(in oklab, var(--ink) 5%, var(--sunken)) 48%,
      var(--sunken) 66%);
    background-size: 200% 100%;
    animation: ox-shimmer 1.6s linear infinite;
    border-radius: var(--r-xs);
  }
  .antd .rec-dot { animation: ox-pulse-ring 1.8s var(--ease-both) infinite; }
  .antd .wave i { animation: ox-wave 1.1s var(--ease-both) infinite; transform-origin: center; }
  .antd .wave i:nth-child(3n)   { animation-delay: -0.35s }
  .antd .wave i:nth-child(3n+1) { animation-delay: -0.7s }
  .antd .diff .ins, .antd .diff .unv { animation: ox-stream var(--dur-state) var(--ease-out) both; }

  @media (prefers-reduced-motion: reduce) {
    .antd *, .antd *::before, .antd *::after {
      animation-duration: 1ms !important; animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
    .antd .sk { background: var(--sunken); }
    .antd .a-caret { opacity: 1; }
  }

  /* ==================================================================== */
  /*  STRUCTURE PASS                                                      */
  /*  The re-skin fixed the palette. This fixes the thing that actually   */
  /*  read as "generic admin panel": a bordered white box inside a        */
  /*  bordered white box inside a bordered white box.                     */
  /*  Rule adopted: ONE border per nesting stack. Depth is expressed by   */
  /*  tone and hairline rules; a box outline is reserved for the outermost*/
  /*  container and for anything carrying a status.                       */
  /* ==================================================================== */

  .antd .a-card .tile,
  .antd .a-app  .tile,
  .antd .statecell {
    border-color: transparent;
    background: var(--sunken);
    box-shadow: none;
  }
  /* Status is the one thing that still earns an outline — and it gets a
     rail rather than a full tint, so the tint stays available for selection. */
  .antd .a-card .tile.crit, .antd .a-app .tile.crit,
  .antd .a-card .tile.warn, .antd .a-app .tile.warn,
  .antd .a-card .tile.ok,   .antd .a-app .tile.ok,
  .antd .a-card .tile.ai,   .antd .a-app .tile.ai,
  .antd .a-card .tile.sel,  .antd .a-app .tile.sel,
  .antd .a-card .tile.ghost,.antd .a-app .tile.ghost {
    border-color: currentColor;
  }
  .antd .tile.crit { border-inline-start: 2px solid var(--crit); color: inherit; }
  .antd .tile.warn { border-inline-start: 2px solid var(--warn); }
  .antd .tile.ok   { border-inline-start: 2px solid var(--ok); }
  .antd .tile.ai   { border-inline-start: 2px solid var(--info); }
  .antd .tile.crit, .antd .tile.warn, .antd .tile.ok, .antd .tile.ai {
    border-block: 0; border-inline-end: 0;
    border-start-start-radius: 0; border-end-start-radius: 0;
  }
  .antd .tile.sel {
    border: 0; border-inline-start: 2px solid var(--accent);
    background: var(--accent-soft); box-shadow: none;
    border-start-start-radius: 0; border-end-start-radius: 0;
  }
  .antd .tile.ghost { border: 1px dashed var(--line-2); background: transparent; }

  /* Section labels inside a surface: a hairline rule, not a header band. */
  .antd .lbl {
    display: flex; align-items: center; gap: var(--sp-2);
    font-size: var(--fs-micro); font-weight: var(--fw-sb);
    letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--ink-4);
  }
  .antd .lbl::after {
    content: ""; flex: 1 1 auto; height: 1px; background: var(--line); min-width: var(--sp-3);
  }
  .antd .row > .lbl, .antd .lbl.bare { display: inline-flex; }
  .antd .row > .lbl::after, .antd .lbl.bare::after { display: none; }

  /* Statecell names are the fifth uppercase micro-label on some screens.
     Demote them to sentence case so the uppercase channel keeps its meaning. */
  .antd .statecell .nm {
    text-transform: none; letter-spacing: 0; font-size: var(--fs-xs);
    font-weight: var(--fw-sb); color: var(--ink-3);
    padding-bottom: var(--sp-2); border-bottom: 1px solid var(--line); margin-bottom: var(--sp-2);
  }
  .antd .statecell { padding: var(--sp-3); border-radius: var(--r-md); }
  .antd .statesgrid { gap: var(--sp-2); }

  /* Band caption: the one place uppercase-mono chrome is worth its noise. */
  .antd .bandcap {
    font-family: var(--font-num); font-size: var(--fs-micro); color: var(--ink-4);
    letter-spacing: var(--tr-label); gap: var(--sp-3); margin-bottom: var(--sp-3);
  }
  .antd .band + .band { margin-top: var(--sp-6); }

  /* ==================================================================== */
  /*  NUMERALS — the strongest "this is a data product" signal            */
  /*  A value, its unit and its delta are three ranks, not one string.    */
  /* ==================================================================== */
  .antd .mono.b, .antd .b.mono { letter-spacing: -0.02em; font-weight: var(--fw-sb); }
  .antd td .mono.b { font-size: var(--fs-md); }
  .antd .a-tbl td > .mono + .t3,
  .antd .a-tbl td > .mono + .sm.t3 { font-weight: var(--fw-r); color: var(--ink-4); }

  /* ==================================================================== */
  /*  FLAT CARD DEFAULT — shadow is for overlays only                     */
  /* ==================================================================== */
  .antd .a-card { box-shadow: none; }
  .antd .a-card.raised, .antd .cmdk, .antd .dock { box-shadow: var(--e-3); }
  .antd .a-app { box-shadow: var(--e-1); }

  /* Popovers and floating layers keep depth, everything else earns none. */
  .antd .cmdk {
    border: 1px solid var(--line-2); border-radius: var(--r-lg);
    background: var(--overlay); overflow: clip;
  }
  .antd .cmdk-row {
    padding: var(--sp-2) var(--sp-3); gap: var(--sp-3); font-size: var(--fs-md);
    border-inline-start: 2px solid transparent;
    transition: background-color var(--dur-micro) var(--ease-out),
                border-color var(--dur-micro) var(--ease-out);
  }
  .antd .cmdk-row:hover { background: var(--sunken); }
  .antd .cmdk-row.on { background: var(--accent-soft); border-inline-start-color: var(--accent); }
  .antd .cmdk-grp {
    padding: var(--sp-3) var(--sp-3) var(--sp-1); color: var(--ink-4);
    font-size: var(--fs-micro); letter-spacing: var(--tr-label);
  }
  .antd .dock { border: 1px solid var(--line-2); border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .antd .dock-h {
    padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3);
    background: var(--sunken); border-bottom: 1px solid var(--line); gap: var(--sp-2);
  }
  .antd .dock-h .ttl { font-size: var(--fs-sm); font-weight: var(--fw-sb); }

  /* ==================================================================== */
  /*  STEPPER, THREAD, RANGE — on the scale                               */
  /* ==================================================================== */
  .antd .steprail .s { grid-template-columns: 18px 1fr; gap: var(--sp-3); }
  .antd .steprail .s .d {
    width: 11px; height: 11px; border: 2px solid var(--line-3); background: var(--surface); margin-top: 4px;
    transition: background-color var(--dur-state) var(--ease-out), border-color var(--dur-state) var(--ease-out);
  }
  .antd .steprail .s .d.done { background: var(--ok); border-color: var(--ok); }
  .antd .steprail .s .d.now  { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
  .antd .steprail .s .d.blocked { border-color: var(--crit); background: var(--crit-soft); }
  .antd .steprail .s .ln { width: 1px; background: var(--line-2); min-height: var(--sp-3); }
  .antd .steprail .s .c { padding-bottom: var(--sp-3); }

  .antd .thread { border-inline-start-width: 2px; padding-inline-start: var(--sp-3); }

  .antd .rng .track { border: 0; background: var(--sunken); border-radius: var(--r-full); height: 6px; inset-block-start: 10px; }
  .antd .rng .band  { background: var(--ok-soft); border-inline: 1px solid var(--ok-line); height: 6px; inset-block-start: 10px; }
  .antd .rng .pin   { background: var(--ink); width: 2px; border-radius: var(--r-full); }
  .antd .rng .pin.crit { background: var(--crit); box-shadow: 0 0 0 3px color-mix(in oklab, var(--crit) 18%, transparent); }
  .antd .rng .pin.warn { background: var(--warn); }
  .antd .rng .pin.prev { background: var(--ink-5); }
  .antd .rng .cap { font-size: var(--fs-micro); color: var(--ink-4); }

  /* ==================================================================== */
  /*  CHART CHROME                                                        */
  /* ==================================================================== */
  .antd .chart .gridline { stroke: var(--line); }
  .antd .chart .axis     { stroke: var(--line-2); }
  .antd .chart .axlabel  { fill: var(--ink-4); font-family: var(--font-num); font-size: 9.5px; letter-spacing: 0; }
  .antd .chart .refband  { fill: var(--ok-soft); }
  .antd .chart .warnband { fill: var(--warn-soft); }
  .antd .chart .critband { fill: var(--crit-soft); }
  .antd .chart .pt       { stroke: var(--surface); stroke-width: 1.5; }
  .antd .chart .series   { stroke-width: 1.75; }

  /* ==================================================================== */
  /*  DIFF / HEAT / MATRIX                                                */
  /* ==================================================================== */
  .antd .diff .ins { background: var(--ok-soft);   border-block-end: 1px solid var(--ok-line); }
  .antd .diff .unv { background: var(--warn-soft); border-block-end: 1px dashed var(--warn-line); }
  .antd .diff .del { background: var(--crit-soft); text-decoration-color: var(--crit); color: var(--ink-3); }
  .antd .diff mark.cite {
    background: var(--accent-soft); color: var(--accent-ink); border-radius: var(--r-xs);
    padding: 0 3px; font-size: var(--fs-micro); font-family: var(--font-num);
  }
  .antd .imx td    { background: var(--sunken); color: var(--ink-4); border-radius: var(--r-xs); }
  .antd .imx td.x  { background: transparent; }
  .antd .imx td.s0 { background: var(--sunken); }
  .antd .imx td.s1 { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn-ink); }
  .antd .imx td.s2 { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn-ink); }
  .antd .imx td.s3 { background: var(--crit-soft); border-color: var(--crit-line); color: var(--crit-ink); font-weight: var(--fw-sb); }
  .antd .imx th    { color: var(--ink-3); font-size: var(--fs-micro); }

  /* ==================================================================== */
  /*  THE STAGE — mockups sit on their own ground, not the document's     */
  /* ==================================================================== */
  .stage {
    background:
      radial-gradient(circle at 1px 1px, color-mix(in oklab, var(--ink) 8%, transparent) 1px, transparent 0)
      0 0 / 22px 22px,
      var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: clamp(1.1rem, 3vw, 2.1rem);
  }

  /* Video-surface chrome: the one place a deliberately dark ground is correct
     in both themes, because a camera preview is a camera preview. */
  .antd { --video-a: #223033; --video-b: #101B20; --video-c: #0A1216; }

  /* SVG presentation attributes now carry var(); make sure the chart classes
     that still rely on CSS keep winning over them. */
  .antd .chart .series { stroke-linecap: round; stroke-linejoin: round; }

  .antd { --fs-chart: 9.5px; }

  /* ==================================================================== */
  /*  INTERACTION LAYER                                                   */
  /*  The audit's finding was that the catalogue is a set of still frames. */
  /*  Everything below is real behaviour in a real browser: hover, focus, */
  /*  press, selection and streaming all respond. Nothing here is a       */
  /*  picture of a state.                                                 */
  /* ==================================================================== */

  /* --- rows ---------------------------------------------------------- */
  .antd .a-tbl tbody tr { position: relative; }
  .antd .a-tbl tbody tr td:first-child { position: relative; }
  .antd .a-tbl tbody tr:hover .a-btn { border-color: var(--line-3); }
  .antd .cmdk-row, .antd .tile, .antd .statecell {
    transition: background-color var(--dur-micro) var(--ease-out),
                border-color var(--dur-micro) var(--ease-out),
                box-shadow var(--dur-micro) var(--ease-out);
  }
  .antd .statecell:hover { background: color-mix(in oklab, var(--accent) 5%, var(--sunken)); }

  /* --- chips: focusable when they carry an explanation ---------------- */
  .antd .cs { transition: box-shadow var(--dur-micro) var(--ease-out), filter var(--dur-micro) var(--ease-out); }
  .antd .cs:hover { filter: saturate(1.15) brightness(0.99); }
  .antd .a-tag { transition: border-color var(--dur-micro) var(--ease-out); }

  /* --- the universal focus ring: one shape, every control ------------- */
  .antd :is(.a-btn, .a-tag, .cs, .tile, .cmdk-row, .a-seg span, .win-btn, .kbd, .a-avatar):focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring);
    border-radius: var(--r-sm);
  }

  /* --- press: one downward pixel, 90ms, on everything pressable ------- */
  .antd :is(.a-btn, .a-seg span, .win-btn):active { translate: 0 1px; }

  /* --- disabled: stated, not merely faded ----------------------------- */
  .antd .is-disabled, .antd [data-disabled] {
    opacity: 0.55; pointer-events: none;
    background-image: repeating-linear-gradient(135deg,
      transparent 0 5px, color-mix(in oklab, var(--ink) 4%, transparent) 5px 10px);
  }

  /* --- loading: a control that is working says so --------------------- */
  .antd .is-loading { position: relative; color: transparent !important; pointer-events: none; }
  .antd .is-loading::after {
    content: ""; position: absolute; inset: 50% auto auto 50%;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border: 1.5px solid color-mix(in oklab, currentColor 25%, transparent);
    border-top-color: var(--accent); border-radius: 50%;
    animation: ox-spin 700ms linear infinite;
  }
  @keyframes ox-spin { to { rotate: 360deg } }

  /* --- live values: a number that just changed says so ---------------- */
  @keyframes ox-tick {
    0%   { background: color-mix(in oklab, var(--accent) 22%, transparent); }
    100% { background: transparent; }
  }
  .antd .is-live { animation: ox-tick 1.2s var(--ease-out); border-radius: var(--r-xs); }

  /* --- critical: the one place motion is allowed to insist ------------ */
  .antd .cs-crit.is-urgent { animation: ox-pulse-ring 2.2s var(--ease-both) infinite; }

  /* --- expandable rows / progressive disclosure ----------------------- */
  .antd .disclose { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-layout) var(--ease-out); }
  .antd .disclose > * { overflow: hidden; }
  .antd .disclose.open, .antd .tile:hover > .disclose, .antd .a-tbl tr:hover .disclose { grid-template-rows: 1fr; }

  /* --- streaming text ------------------------------------------------- */
  .antd .streaming > * { animation: ox-stream var(--dur-state) var(--ease-out) both; }
  .antd .streaming > :nth-child(2) { animation-delay: 60ms }
  .antd .streaming > :nth-child(3) { animation-delay: 120ms }
  .antd .streaming > :nth-child(4) { animation-delay: 180ms }
  .antd .streaming > :nth-child(5) { animation-delay: 240ms }

  /* --- drag affordance ------------------------------------------------ */
  .antd .draggable { cursor: grab; }
  .antd .draggable:active { cursor: grabbing; box-shadow: var(--e-2); translate: 0 -1px; }

  /* --- the states matrix used in the interaction section -------------- */
  .statematrix { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
  .statematrix > div { background: var(--surface); padding: 0.85rem 0.95rem; }
  .statematrix .sh { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
  .statematrix .demo { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; min-height: 2.6rem; }
  .statematrix .note { font-size: 0.76rem; color: var(--muted); line-height: 1.45; }

  .motiontable td .bar { display: block; height: 6px; border-radius: 3px; background: var(--accent); opacity: 0.85; }

  /* ==================================================================== */
  /*  DESIGN-SYSTEM AND AUDIT SECTION CHROME                              */
  /* ==================================================================== */
  .ox { color: var(--ink); }

  .scalebar { display: flex; align-items: flex-end; gap: 6px; height: 4.2rem; }
  .scalebar span {
    background: var(--accent); border-radius: 2px; height: 100%; min-width: 1px;
    position: relative; opacity: 0.82;
  }
  .scalebar span::after {
    content: attr(data-t); position: absolute; inset-block-end: -1.15rem; inset-inline-start: 50%;
    transform: translateX(-50%); font-family: var(--font-mono); font-size: 0.6rem; color: var(--muted);
  }
  .scalebar { margin-bottom: 1.3rem; }

  .typescale > div { display: flex; align-items: baseline; gap: 0.75rem; padding: 0.24rem 0; border-bottom: 1px dashed var(--rule); }
  .typescale > div:last-child { border-bottom: 0; }
  .typescale b { font-family: var(--font-mono); color: var(--ink); min-width: 3.4rem; line-height: 1.1; }
  .typescale span { font-size: 0.78rem; color: var(--muted); }

  .radscale { display: flex; gap: 0.55rem; flex-wrap: wrap; }
  .radscale span {
    width: 3rem; height: 3rem; display: grid; place-items: center;
    background: var(--surface-2); border: 1px solid var(--rule-2);
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted);
  }

  .elevscale { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 0.6rem; }
  .elevscale span {
    padding: 0.9rem 0.6rem; border-radius: 10px; background: var(--surface);
    font-family: var(--font-mono); font-size: 0.64rem; color: var(--muted); text-align: center;
  }
  .elevscale .e0 { border: 1px solid var(--rule); }
  .elevscale .e1 { border: 1px solid var(--rule); box-shadow: 0 1px 2px -1px rgb(10 21 20 / 0.10); }
  .elevscale .e2 { border: 1px solid var(--rule); box-shadow: 0 4px 12px -4px rgb(10 21 20 / 0.14), 0 1px 2px -1px rgb(10 21 20 / 0.06); }
  .elevscale .e3 { border: 1px solid var(--rule); box-shadow: 0 14px 34px -10px rgb(10 21 20 / 0.20), 0 3px 8px -3px rgb(10 21 20 / 0.08); }

  .rampgrid { display: grid; gap: 0.4rem; margin: 1.25rem 0; }
  .rampgrid > div { display: grid; grid-template-columns: 6rem repeat(4, 2.6rem) 1fr; gap: 0.35rem; align-items: center; }
  .rampgrid .rn { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-2); }
  .rampgrid .rv { font-size: 0.76rem; color: var(--muted); padding-inline-start: 0.5rem; }
  .rampgrid i { height: 1.9rem; border-radius: 5px; display: block; border: 1px solid rgb(0 0 0 / 0.06); }
  .r-accent-soft{background:#E4F3EF}.r-accent-line{background:#9FD3C6}.r-accent{background:#0E7C66}.r-accent-ink{background:#075244}
  .r-crit-soft{background:#FEF3F2}.r-crit-line{background:#F5B5AE}.r-crit{background:#B42318}.r-crit-ink{background:#912018}
  .r-warn-soft{background:#FFFAEB}.r-warn-line{background:#F5CE7A}.r-warn{background:#B54708}.r-warn-ink{background:#93370D}
  .r-ok-soft{background:#ECFDF3}.r-ok-line{background:#9BE5BC}.r-ok{background:#067647}.r-ok-ink{background:#05603A}
  .r-info-soft{background:#EFF8FF}.r-info-line{background:#A9D4FB}.r-info{background:#175CD3}.r-info-ink{background:#1849A9}
  .r-ai-soft{background:#F5F3FF}.r-ai-line{background:#CFC6F6}.r-ai{background:#5B44BE}.r-ai-ink{background:#4A35A0}
  .r-rest-soft{background:#EEF4FF}.r-rest-line{background:#BFCEFB}.r-rest{background:#3538CD}.r-rest-ink{background:#2D31A6}

  /* ---- audit table --------------------------------------------------- */
  .auditwrap { max-height: none; }
  .audittbl { font-size: 0.8rem; min-width: 1080px; }
  .audittbl th { font-size: 0.6rem; letter-spacing: 0.08em; padding: 0.55rem 0.35rem; }
  .audittbl td { padding: 0.5rem 0.45rem; vertical-align: middle; }
  .audittbl td.c, .audittbl th.c { text-align: center; }
  .audittbl a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule-2); font-weight: 600; }
  .audittbl a:hover { border-color: var(--accent); color: var(--accent-ink); }
  .audittbl .defect { font-size: 0.76rem; color: var(--ink-2); line-height: 1.45; }
  .audittbl .s-hi  { color: var(--ok); font-variant-numeric: tabular-nums; }
  .audittbl .s-mid { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .audittbl .s-lo  { color: var(--bad); font-weight: 600; font-variant-numeric: tabular-nums;
                     background: color-mix(in oklab, var(--bad) 8%, transparent); }
  .disp { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; padding: 0.16rem 0.4rem;
          border-radius: 4px; border: 1px solid var(--rule-2); color: var(--muted); white-space: nowrap; }
  .d-keep     { border-color: color-mix(in oklab, var(--ok) 45%, transparent); background: var(--ok-soft); color: var(--ok); }
  .d-refine   { border-color: color-mix(in oklab, var(--warn) 45%, transparent); background: var(--warn-soft); color: var(--warn); }
  .d-redesign { border-color: color-mix(in oklab, var(--bad) 45%, transparent); background: var(--bad-soft); color: var(--bad); }
  .d-merge    { border-color: color-mix(in oklab, var(--accent) 45%, transparent); background: var(--accent-soft); color: var(--accent-ink); }

  .axiskpi { grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); }
  .axiskpi .v { font-size: 1.4rem; }
  .axiskpi .v.s-hi { color: var(--ok); } .axiskpi .v.s-mid { color: var(--accent-ink); } .axiskpi .v.s-lo { color: var(--bad); }
  .rangebar { height: 4px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--rule); margin-top: 0.45rem; overflow: hidden; }
  .rangebar i { display: block; height: 100%; background: var(--accent); }

  @media (max-width: 760px) {
    .rampgrid > div { grid-template-columns: 5rem repeat(4, 1fr); }
    .rampgrid .rv { grid-column: 1 / -1; padding: 0 0 0.4rem; }
    .statematrix { grid-template-columns: 1fr !important; }
  }

  /* A spinner drawn in the accent is invisible on an accent-filled button. */
  .antd .a-btn.primary.is-loading::after {
    border-color: rgb(255 255 255 / 0.32); border-top-color: var(--on-accent);
  }

  /* Ten axes wrap to 8+2 on auto-fit and leave an orphan tile. Pin to 5x2. */
  .axiskpi { grid-template-columns: repeat(5, 1fr); }
  @media (max-width: 900px) { .axiskpi { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .axiskpi { grid-template-columns: repeat(2, 1fr); } }

  /* Layout for the state matrix belongs in CSS, not in a style attribute —
     an inline grid definition cannot be overridden by a breakpoint. */
  .statematrix { grid-template-columns: 8.5rem repeat(3, minmax(0, 1fr)); }
  .statematrix > div { min-width: 0; overflow-x: auto; }
  .statematrix .demo { min-width: 0; }
  @media (max-width: 900px) {
    .statematrix { grid-template-columns: 6.5rem repeat(3, minmax(0, 1fr)); }
    .statematrix > div { padding: 0.6rem 0.65rem; }
  }
  @media (max-width: 700px) {
    .statematrix { grid-template-columns: 1fr; }
    .statematrix .sh { position: sticky; top: 0; z-index: 1; }
    .statematrix > div:nth-child(-n+4) { display: none; }
    .statematrix > div[style*="span 3"] { grid-column: auto !important; }
  }


  /* ==================================================================== */
  /*  DATE / TIME / SESSION — mockup layer.                               */
  /*  Every rule spends an Oxygen token from the v2 layer above. The one  */
  /*  exception is geometry the token set does not name (a 7-column month */
  /*  grid), which is expressed in --sp-* multiples rather than literals. */
  /* ==================================================================== */

  /* Every control in these figures is a real <button>, because a calendar
     cell that is a div with role="button" is one missing key handler away
     from being unusable. The earlier briefs in this series never needed
     this reset — they drew controls as divs — so the UA's ButtonFace
     background was turning the month grid into a spreadsheet. Scored at
     (0,1,1) so every component class below still wins. */
  .antd button {
    appearance: none; -webkit-appearance: none;
    background: none; border: 0; margin: 0; padding: 0;
    font: inherit; color: inherit; text-align: inherit;
    cursor: default;
  }
  .antd button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Field: the segmented, typable date/time input ----------------- */
  .antd .dtf {
    display: inline-flex; align-items: center; gap: 0;
    height: var(--ctl-lg); padding: 0 var(--sp-1) 0 var(--sp-2);
    border: 1px solid var(--line-3); border-radius: var(--r-sm);
    background: var(--surface); color: var(--ink);
    font-variant-numeric: tabular-nums; font-size: var(--fs-md);
    transition: border-color var(--dur-micro) var(--ease-out),
                box-shadow var(--dur-micro) var(--ease-out);
    cursor: text; user-select: none; -webkit-user-select: none;
  }
  .antd .dtf:hover { border-color: var(--ink-4); }
  .antd .dtf.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .antd .dtf.err   { border-color: var(--crit); }
  .antd .dtf.err.focus { box-shadow: 0 0 0 3px color-mix(in oklab, var(--crit) 30%, transparent); }
  .antd .dtf.warnf { border-color: var(--warn-line); background: var(--warn-soft); }
  .antd .dtf.ro    { border-color: transparent; background: transparent; padding-inline-start: 0; cursor: default; }
  .antd .dtf.dis   { border-color: var(--line); background: var(--sunken); color: var(--ink-4); pointer-events: none; }
  .antd .dtf.wide  { min-width: 168px; }

  /* A segment is the atom of keyboard entry: one roving tabstop, arrow
     keys step its own unit, digits type into it, and it advances itself
     when it can no longer accept another digit. */
  .antd .dtf .seg {
    padding: 0 2px; border-radius: 2px; min-width: 1.15em; text-align: center;
    transition: background-color var(--dur-press) var(--ease-out), color var(--dur-press) var(--ease-out);
  }
  .antd .dtf .seg.y { min-width: 2.4em; }
  .antd .dtf .seg.ph { color: var(--ink-4); }
  .antd .dtf .seg.on { background: var(--accent); color: var(--on-accent); }
  .antd .dtf.ro .seg.on { background: transparent; color: var(--ink); }
  .antd .dtf .sep { color: var(--ink-4); padding: 0 var(--sp-h); }
  .antd .dtf .fb {
    margin-inline-start: auto; width: var(--ctl-sm); height: var(--ctl-sm);
    display: inline-grid; place-items: center; border-radius: var(--r-xs);
    color: var(--ink-4); flex: 0 0 auto;
    transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
  }
  .antd .dtf .fb:hover { background: var(--sunken); color: var(--ink); }
  .antd .dtf .fb.on { color: var(--accent); }

  /* The label + field + message stack every field shares. */
  .antd .fld { display: grid; gap: var(--sp-1); }
  .antd .fld > .lbl {
    font-size: var(--fs-xs); font-weight: var(--fw-m); color: var(--ink-2);
    letter-spacing: 0; display: flex; align-items: center; gap: var(--sp-1);
  }
  .antd .fld > .lbl .req { color: var(--crit); }
  .antd .fld > .lbl .opt { color: var(--ink-4); font-weight: var(--fw-r); }
  .antd .msg { font-size: var(--fs-xs); color: var(--ink-3); display: flex; align-items: flex-start; gap: var(--sp-1); line-height: var(--lh-xs); }
  .antd .msg .i { margin-top: 1px; }
  .antd .msg.err  { color: var(--crit-ink); }
  .antd .msg.warn { color: var(--warn-ink); }
  .antd .msg.ok   { color: var(--ok-ink); }
  .antd .msg.hint { color: var(--ink-4); }

  /* ---- Popover -------------------------------------------------------- */
  .antd .pop {
    background: var(--overlay); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--e-3);
    padding: var(--sp-3); display: inline-block; position: relative; z-index: 60;
    animation: ox-pop var(--dur-state) var(--ease-out) both;
  }
  .antd .pop.flush { padding: 0; }
  @keyframes ox-pop { from { opacity: 0; translate: 0 -4px; scale: 0.985 } to { opacity: 1; translate: 0; scale: 1 } }
  @media (prefers-reduced-motion: reduce) { .antd .pop { animation: none } }

  /* ---- Calendar ------------------------------------------------------- */
  .antd .cal { width: 252px; user-select: none; -webkit-user-select: none; }
  .antd .cal.wide { width: 100%; }
  .antd .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-1); margin-bottom: var(--sp-2);
  }
  .antd .cal-title {
    font-size: var(--fs-md); font-weight: var(--fw-sb); color: var(--ink);
    letter-spacing: var(--tr-tight); display: inline-flex; align-items: center; gap: var(--sp-1);
    padding: 0 var(--sp-1); height: var(--ctl-sm); border-radius: var(--r-xs);
  }
  .antd .cal-title:hover { background: var(--sunken); }
  .antd .cal-nav {
    width: var(--ctl-sm); height: var(--ctl-sm); display: inline-grid; place-items: center;
    border-radius: var(--r-xs); color: var(--ink-3);
    transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
  }
  .antd .cal-nav:hover { background: var(--sunken); color: var(--ink); }
  .antd .cal-nav[aria-disabled="true"] { color: var(--ink-5); pointer-events: none; }
  .antd .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .antd .cal-wd {
    font-size: var(--fs-micro); font-weight: var(--fw-sb); letter-spacing: var(--tr-label);
    text-transform: uppercase; color: var(--ink-4); text-align: center;
    height: 22px; display: grid; place-items: center;
  }
  .antd .cal-wd.we { color: var(--ink-5); }

  /* 32px is the visual cell; the hit area is the full grid track, so the
     interactive target clears WCAG 2.2 SC 2.5.8 (24px) even in clinical
     density, where only the type and the gap tighten. */
  .antd .cal-d {
    height: 32px; display: grid; place-items: center; position: relative;
    font-size: var(--fs-sm); color: var(--ink); border-radius: var(--r-xs);
    font-variant-numeric: tabular-nums;
    transition: background-color var(--dur-press) var(--ease-out),
                color var(--dur-press) var(--ease-out),
                box-shadow var(--dur-press) var(--ease-out);
  }
  .antd .cal-d:hover { background: var(--sunken); }
  .antd .cal-d.out { color: var(--ink-5); }
  .antd .cal-d.dis { color: var(--ink-5); background: transparent; pointer-events: none; }
  /* A blocked date says why by its mark, not only by being pale: a single
     diagonal for closed, a dot for busy. Colour is never the only cue. */
  .antd .cal-d.dis::after {
    content: ""; position: absolute; inset-inline: 8px; top: 50%; height: 1px;
    background: var(--line-2); rotate: -20deg;
  }
  .antd .cal-d.today { font-weight: var(--fw-sb); color: var(--accent-ink); }
  .antd .cal-d.today::before {
    content: ""; position: absolute; bottom: 4px; width: 3px; height: 3px;
    border-radius: 50%; background: var(--accent);
  }
  .antd .cal-d.sel {
    background: var(--accent); color: var(--on-accent); font-weight: var(--fw-m);
  }
  .antd .cal-d.sel::before { background: var(--on-accent); }
  .antd .cal-d.sel.today { color: var(--on-accent); }
  .antd .cal-d.rng { background: var(--accent-soft); border-radius: 0; color: var(--accent-ink); }
  .antd .cal-d.rng.s { border-start-start-radius: var(--r-xs); border-end-start-radius: var(--r-xs); }
  .antd .cal-d.rng.e { border-start-end-radius: var(--r-xs); border-end-end-radius: var(--r-xs); }
  .antd .cal-d.prev { background: color-mix(in oklab, var(--accent) 8%, transparent); border-radius: 0; }
  .antd .cal-d.kb { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring); z-index: 1; }
  /* Availability density under the numeral — the second signal a slot grid
     would otherwise take a click to reveal. */
  .antd .cal-d .load { position: absolute; bottom: var(--sp-h); display: flex; gap: var(--sp-h); }
  .antd .cal-d .load i { width: 3px; height: 3px; border-radius: 50%; background: var(--ok); }
  .antd .cal-d .load i.q { background: var(--warn); }
  .antd .cal-d.sel .load i { background: var(--on-accent); }
  .antd .cal-foot {
    margin-top: var(--sp-2); padding-top: var(--sp-2); border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: var(--sp-1); flex-wrap: wrap;
  }

  /* Month/year pane — the DOB and historical-date escape hatch. */
  .antd .cal-pane { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-1); }
  .antd .cal-pane b {
    height: 30px; display: grid; place-items: center; border-radius: var(--r-xs);
    font-size: var(--fs-sm); font-weight: var(--fw-r); color: var(--ink);
  }
  .antd .cal-pane b:hover { background: var(--sunken); }
  .antd .cal-pane b.on { background: var(--accent); color: var(--on-accent); font-weight: var(--fw-m); }
  .antd .cal-pane b.dis { color: var(--ink-5); pointer-events: none; }
  .antd .cal-years { max-height: 200px; overflow-y: auto; scrollbar-width: thin; }

  /* ---- Chips: relative dates, durations, presets ---------------------- */
  .antd .chips { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
  .antd .chip {
    height: var(--ctl-sm); padding: 0 var(--sp-2);
    display: inline-flex; align-items: center; gap: var(--sp-1);
    border: 1px solid var(--line-2); border-radius: var(--r-full);
    background: var(--surface); color: var(--ink-2);
    font-size: var(--fs-xs); font-weight: var(--fw-m); white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: background-color var(--dur-micro) var(--ease-out),
                border-color var(--dur-micro) var(--ease-out),
                color var(--dur-micro) var(--ease-out);
  }
  .antd .chip:hover { border-color: var(--line-3); background: var(--sunken); color: var(--ink); }
  .antd .chip.on { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .antd .chip.dis { color: var(--ink-5); background: var(--sunken); border-color: var(--line); pointer-events: none; }
  .antd .chip .n { font-weight: var(--fw-sb); }
  .antd .chip.sq { border-radius: var(--r-sm); }
  .antd .chip .code {
    font-size: var(--fs-micro); opacity: 0.75; font-family: var(--font-num); letter-spacing: 0;
  }

  /* ---- Session: start → end → duration -------------------------------- */
  .antd .sess {
    display: flex; align-items: flex-end; gap: var(--sp-2); flex-wrap: wrap;
  }
  /* Aligned to the control's optical centre rather than nudged: the arrow
     sits in a box the same height as the field it points between, so it
     stays centred when density changes the control height. */
  .antd .sess .arw {
    color: var(--ink-4); flex: 0 0 auto;
    height: var(--ctl-lg); display: inline-flex; align-items: center;
  }
  .antd .durbox {
    height: var(--ctl-lg); min-width: 84px; padding: 0 var(--sp-2);
    display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-1);
    border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--sunken);
    font-variant-numeric: tabular-nums; font-size: var(--fs-md); font-weight: var(--fw-sb); color: var(--ink);
  }
  .antd .durbox.drv { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
  /* The derived value is stated as derived. A field that silently recomputes
     is the single most common defect in start/end/duration triples. */
  .antd .drvtag {
    font-size: var(--fs-micro); letter-spacing: var(--tr-label); text-transform: uppercase;
    font-weight: var(--fw-sb); color: var(--ink-4); display: inline-flex; align-items: center; gap: var(--sp-1);
  }
  .antd .drvtag.held { color: var(--accent-ink); }
  .antd .drvtag .lk { width: 10px; height: 10px; }

  /* Horizontal time tape — makes overnight and buffer legible at a glance. */
  .antd .tape {
    position: relative; height: 34px; border-radius: var(--r-sm);
    background: var(--sunken); border: 1px solid var(--line); overflow: hidden;
  }
  .antd .tape .blk { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: 0.9; }
  .antd .tape .blk.buf { background: var(--warn); opacity: 0.35; }
  .antd .tape .blk.busy { background: var(--crit); opacity: 0.28; }
  .antd .tape .mid {
    position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink-3);
    border-inline-start: 1px dashed var(--ink-3);
  }
  .antd .tape .tk {
    position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-2);
  }
  .antd .tapelabels {
    display: flex; justify-content: space-between; font-size: var(--fs-micro);
    color: var(--ink-4); margin-top: var(--sp-1); font-variant-numeric: tabular-nums;
  }

  /* ---- Slot grid ------------------------------------------------------ */
  .antd .slotgrp { margin-bottom: var(--sp-3); }
  .antd .slotgrp:last-child { margin-bottom: 0; }
  .antd .slotgrp > h6 {
    font-size: var(--fs-micro); letter-spacing: var(--tr-label); text-transform: uppercase;
    font-weight: var(--fw-sb); color: var(--ink-4); margin: 0 0 var(--sp-2);
    display: flex; align-items: center; gap: var(--sp-2);
  }
  .antd .slotgrp > h6 .rule { flex: 1; height: 1px; background: var(--line); }
  .antd .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: var(--sp-1); }
  .antd .slot {
    height: var(--ctl-lg); display: grid; place-items: center;
    border: 1px solid var(--line-2); border-radius: var(--r-sm);
    background: var(--surface); color: var(--ink); font-size: var(--fs-sm);
    font-variant-numeric: tabular-nums; position: relative;
    transition: background-color var(--dur-press) var(--ease-out),
                border-color var(--dur-press) var(--ease-out),
                color var(--dur-press) var(--ease-out),
                box-shadow var(--dur-press) var(--ease-out);
  }
  .antd .slot:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
  .antd .slot.on {
    background: var(--accent); border-color: transparent; color: var(--on-accent);
    font-weight: var(--fw-m); box-shadow: 0 0 0 3px var(--ring);
  }
  /* Three unavailable reasons, one muted treatment, the reason in the
     tooltip and the a11y name. Four separate greys would be noise. */
  .antd .slot.off {
    color: var(--ink-5); background: var(--sunken); border-color: transparent;
    text-decoration: line-through; text-decoration-thickness: 1px; pointer-events: none;
  }
  .antd .slot.held {
    border-color: var(--warn-line); background: var(--warn-soft); color: var(--warn-ink);
  }
  .antd .slot.held::after {
    content: ""; position: absolute; top: 3px; inset-inline-end: 3px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--warn);
  }
  .antd .slot.sk { border-color: transparent; }
  .antd .slot .sub { position: absolute; bottom: 2px; font-size: 9px; color: inherit; opacity: 0.7; }

  /* ---- Day strip: a week of availability above the slot grid ---------- */
  .antd .daystrip { display: grid; grid-auto-flow: column; gap: var(--sp-1); }
  .antd .daycell {
    display: grid; gap: 2px; justify-items: center; padding: var(--sp-1) 2px var(--sp-2);
    border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface);
    transition: border-color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
  }
  .antd .daycell:hover { border-color: var(--line-3); }
  .antd .daycell.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--ring); }
  .antd .daycell.none { background: var(--sunken); border-color: transparent; }
  .antd .daycell .wd { font-size: var(--fs-micro); letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--ink-4); font-weight: var(--fw-sb); }
  .antd .daycell .dd { font-size: var(--fs-lg); font-weight: var(--fw-sb); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: var(--tr-tight); }
  .antd .daycell.on .dd { color: var(--accent-ink); }
  .antd .daycell .ct { font-size: var(--fs-micro); color: var(--ok-ink); font-variant-numeric: tabular-nums; }
  .antd .daycell.none .ct, .antd .daycell.none .dd { color: var(--ink-5); }

  /* ---- Recurrence ----------------------------------------------------- */
  .antd .wdset { display: flex; gap: var(--sp-1); }
  .antd .wdset b {
    width: 32px; height: 32px; display: grid; place-items: center;
    border: 1px solid var(--line-2); border-radius: var(--r-full);
    font-size: var(--fs-xs); font-weight: var(--fw-m); color: var(--ink-2); background: var(--surface);
    transition: background-color var(--dur-micro) var(--ease-out),
                border-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
  }
  .antd .wdset b:hover { border-color: var(--line-3); background: var(--sunken); }
  .antd .wdset b.on { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  /* The plain-language echo of the rule. It is the only part of a
     recurrence builder most users read, so it is rendered as content. */
  .antd .rrsum {
    padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md);
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    color: var(--accent-ink); font-size: var(--fs-md); line-height: var(--lh-md);
  }
  .antd .rrsum b { font-weight: var(--fw-sb); }
  .antd .rrcode {
    font-family: var(--font-num); font-size: var(--fs-micro); color: var(--ink-4);
    letter-spacing: 0; margin-top: var(--sp-1); display: block;
    overflow-x: auto; white-space: nowrap; scrollbar-width: thin;
  }
  .antd .rrcode + .rrcode { margin-top: 1px; }
  /* Series preview — each occurrence carries its own resolution. */
  /* The document sheet gives every ul a 1.35rem inline start padding and a
     1rem bottom margin. Inside a bordered list that reads as a 22px indent
     nothing asked for, so the reset is part of the component, not a tidy-up. */
  .antd .occ {
    display: grid; gap: 1px; background: var(--line);
    border: 1px solid var(--line); border-radius: var(--r-md); overflow: clip;
    list-style: none; margin: 0; padding: 0;
  }
  .antd .occ > li {
    display: grid; grid-template-columns: 20px 1fr auto; gap: var(--sp-2); align-items: center;
    padding: var(--sp-1) var(--sp-2); background: var(--surface); font-size: var(--fs-sm);
    list-style: none; margin: 0;
  }
  .antd .occ > li .n { font-size: var(--fs-micro); color: var(--ink-4); font-variant-numeric: tabular-nums; text-align: end; }
  .antd .occ > li .dt { font-variant-numeric: tabular-nums; color: var(--ink); }
  .antd .occ > li.bad { background: var(--crit-soft); }
  .antd .occ > li.bad .dt { color: var(--crit-ink); }
  .antd .occ > li.skip { background: var(--sunken); }
  .antd .occ > li.skip .dt { color: var(--ink-4); text-decoration: line-through; text-decoration-thickness: 1px; }
  .antd .occ > li .fix { font-size: var(--fs-micro); }

  /* ---- Timezone ------------------------------------------------------- */
  .antd .tzpair {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--sp-3);
    padding: var(--sp-3); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--sunken);
  }
  /* Renamed from .who: base.css already owns `.antd .who` for the timeline
     byline, and inheriting its flex+5px gap put this label off the grid. */
  .antd .tzcell .zlab { font-size: var(--fs-micro); letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--ink-4); font-weight: var(--fw-sb); }
  .antd .tzcell .tm { font-size: var(--fs-xl); font-weight: var(--fw-sb); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: var(--tr-tight); margin-top: 2px; }
  .antd .tzcell .zn { font-size: var(--fs-xs); color: var(--ink-3); }
  .antd .tzcell.mine .tm { color: var(--accent-ink); }

  /* ---- Mobile frame --------------------------------------------------- */
  .antd .phone {
    width: 300px; height: 580px; border-radius: 30px; border: 8px solid var(--ink);
    background: var(--bg); position: relative; overflow: clip; box-shadow: var(--e-3);
    display: flex; flex-direction: column;
  }
  .antd .phone .notch {
    position: absolute; top: 0; inset-inline: 0; height: 24px; display: grid; place-items: center;
    font-size: 9px; color: var(--ink-4); letter-spacing: var(--tr-label);
  }
  .antd .phone .scr { flex: 1; padding: var(--sp-8) var(--sp-3) var(--sp-3); overflow: hidden; position: relative; }
  .antd .sheet {
    position: absolute; inset-inline: 0; bottom: 0; background: var(--overlay);
    border-start-start-radius: var(--r-xl); border-start-end-radius: var(--r-xl);
    border-top: 1px solid var(--line); box-shadow: var(--e-3);
    padding: var(--sp-2) var(--sp-3) var(--sp-4);
    transition: translate var(--dur-layout) var(--ease-out);
  }
  .antd .sheet.shut { translate: 0 100%; }
  .antd .sheet .grab { width: 34px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto var(--sp-2); }
  .antd .scrim {
    position: absolute; inset: 0; background: rgb(var(--shadow-ink) / 0.35);
    opacity: 1; transition: opacity var(--dur-state) var(--ease-out);
  }
  .antd .scrim.shut { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    .antd .sheet, .antd .scrim { transition: none }
  }
  /* On a touch target the mobile slot is 44px, not 32 — density is a
     contract, and `patient` is the profile a portal renders under. */
  .antd .phone .slot, .antd .sheet .slot { height: 44px; }
  .antd .phone .cal-d, .antd .sheet .cal-d { height: 40px; font-size: var(--fs-md); }
  .antd .phone .dtf, .antd .sheet .dtf { height: var(--ctl-xl); font-size: var(--fs-lg); }

  /* ---- Keystroke cast -------------------------------------------------- */
  .antd .keycast { display: grid; gap: var(--sp-1); }
  .antd .keyrow { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); }
  .antd .keyrow .out { font-family: var(--font-num); color: var(--ink); font-variant-numeric: tabular-nums; }
  .antd .keyrow .arw { color: var(--ink-5); }
  .antd .keyrow.dim { opacity: 0.45; }

  /* ---- Read-only clinical display -------------------------------------- */
  .antd .ro-grid { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-1) var(--sp-4); align-items: baseline; margin: 0; }
  .antd .ro-grid dt { font-size: var(--fs-xs); color: var(--ink-4); letter-spacing: 0; }
  .antd .ro-grid dd { margin: 0; font-size: var(--fs-md); color: var(--ink); font-variant-numeric: tabular-nums; }
  .antd .ro-grid dd .rel { color: var(--ink-4); font-size: var(--fs-xs); margin-inline-start: var(--sp-1); }
  .antd .ro-grid dd .abs { color: var(--ink-3); font-size: var(--fs-xs); }

  /* ---- Report-side helpers -------------------------------------------- */
  /* min() so a 320px track never forces the grid wider than its container.
     `minmax(320px, 1fr)` is the single most common cause of a page that
     reflows correctly at 360 and overflows at 320. */
  .stagegrid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); align-items: start; }
  .stagegrid.two { grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); }
  .mocklabel {
    display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.85rem;
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .mocklabel .no { color: var(--accent); font-weight: 700; }
  .mocklabel .live {
    margin-inline-start: auto; text-transform: none; letter-spacing: 0;
    font-size: 0.66rem; color: var(--accent-ink); background: var(--accent-soft);
    border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
    border-radius: 999px; padding: 0.1rem 0.5rem;
  }
  .themebtn {
    flex: 0 0 auto; font-size: 0.72rem; padding: 0.3rem 0.6rem; border-radius: 6px;
    border: 1px solid var(--rule-2); background: var(--surface); color: var(--muted);
    font-family: var(--font-mono); letter-spacing: 0.06em; margin-inline-start: auto;
  }
  .themebtn:hover { color: var(--ink); border-color: var(--accent); }

  /* The four-jobs spine, used in §2 and referenced throughout. */
  .jobs { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .jobs > div { display: grid; grid-template-columns: 8.5rem 1fr; gap: 1.1rem; padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--rule); }
  .jobs > div:last-child { border-bottom: 0; }
  .jobs .jn { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .jobs .jn small { display: block; font-family: var(--font-body); font-size: 0.72rem; letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 400; margin-top: 0.3rem; }
  .jobs .jd { font-size: 0.9rem; color: var(--ink-2); line-height: 1.6; }
  .jobs .jd b { color: var(--ink); }
  .jobs .jd .ex { display: block; margin-top: 0.5rem; font-size: 0.82rem; color: var(--muted); }
  @media (max-width: 640px) { .jobs > div { grid-template-columns: 1fr; gap: 0.5rem } }

  /* State matrix — every cell is a live render, not a screenshot. */
  .smx { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: auto; }
  .smx > div { background: var(--surface); padding: 0.7rem 0.75rem; min-width: 0; }
  .smx .sh { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; z-index: 1; }
  .smx .rh { font-size: 0.76rem; font-weight: 600; color: var(--ink); background: var(--surface-2); position: sticky; inset-inline-start: 0; }
  .smx .cell { display: grid; place-items: center; min-height: 54px; }
  .smx .na { color: var(--ink-5); font-size: 0.7rem; }

  .legend { display: flex; flex-wrap: wrap; gap: 0.9rem; font-size: 0.8rem; color: var(--muted); margin-top: 1rem; }
  .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--rule-2); display: inline-block; }

  /* ==================================================================== */
  /*  FORCED THEME — §45 items 25 and 26 must sit side by side, which the */
  /*  root-level [data-theme] selector cannot express. These two classes  */
  /*  pin a subtree to one palette. Values are copied from the v2 layer   */
  /*  above; if they ever diverge, the side-by-side is the thing that     */
  /*  shows it, which is the argument for having it in the report.        */
  /* ==================================================================== */
  /* Specificity, deliberately: the dark override in the base sheet is
     `:root:not([data-theme="light"]) .antd`, which scores (0,3,0). A plain
     `.antd.tlight` scores (0,2,0) and loses no matter what order it loads
     in — which rendered the "light theme" panel dark. Repeating the class
     and anchoring on :root takes it to (0,4,0). */
  :root .antd.tlight.tlight {
    --ink: #0A1514; --ink-2: #384A46; --ink-3: #5C6D69; --ink-4: #63736E; --ink-5: #A3B0AC;
    --bg: #F7F9F9; --surface: #FFFFFF; --sunken: #F1F4F4; --raised: #FFFFFF; --overlay: #FFFFFF;
    --line: #E4EAE8; --line-2: #D2DBD8; --line-3: #849993;
    --accent: #0E7C66; --accent-hover: #0B6754; --accent-press: #085243; --accent-soft: #E4F3EF;
    --accent-line: #9FD3C6; --accent-ink: #075244; --on-accent: #FFFFFF; --ring: rgb(14 124 102 / 0.32);
    --crit: #B42318; --crit-soft: #FEF3F2; --crit-line: #F5B5AE; --crit-ink: #912018;
    --warn: #B54708; --warn-soft: #FFFAEB; --warn-line: #F5CE7A; --warn-ink: #93370D;
    --ok: #067647; --ok-soft: #ECFDF3; --ok-line: #9BE5BC; --ok-ink: #05603A;
    --info: #175CD3; --info-soft: #EFF8FF; --info-line: #A9D4FB; --info-ink: #1849A9;
    --ai: #5B44BE; --ai-soft: #F5F3FF; --ai-line: #CFC6F6; --ai-ink: #4A35A0;
    --rest: #3538CD; --rest-soft: #EEF4FF; --rest-line: #BFCEFB; --rest-ink: #2D31A6;
    --shadow-ink: 10 21 20;
    --e-1: 0 1px 2px -1px rgb(var(--shadow-ink) / 0.10);
    --e-2: 0 4px 12px -4px rgb(var(--shadow-ink) / 0.14), 0 1px 2px -1px rgb(var(--shadow-ink) / 0.06);
    --e-3: 0 14px 34px -10px rgb(var(--shadow-ink) / 0.20), 0 3px 8px -3px rgb(var(--shadow-ink) / 0.08);
    color-scheme: light;
  }
  :root .antd.tdark.tdark {
    --ink: #E8F0EE; --ink-2: #B6C6C2; --ink-3: #8A9C98; --ink-4: #70837E; --ink-5: #4B5B57;
    --bg: #080F0E; --surface: #0E1817; --sunken: #0A1211; --raised: #14201E; --overlay: #172522;
    --line: #1E2C2A; --line-2: #2A3B38; --line-3: #506864;
    --accent: #34C6A4; --accent-hover: #4FD6B6; --accent-press: #29A98B; --accent-soft: #0C2A25;
    --accent-line: #1E5B4D; --accent-ink: #7FE3CB; --on-accent: #04201A; --ring: rgb(52 198 164 / 0.36);
    --crit: #F97066; --crit-soft: #2A1210; --crit-line: #6B231C; --crit-ink: #FDA29B;
    --warn: #F5A524; --warn-soft: #2A1E08; --warn-line: #6B4A11; --warn-ink: #FDC873;
    --ok: #47C98B; --ok-soft: #08241A; --ok-line: #14543A; --ok-ink: #83E0B4;
    --info: #5AA0F5; --info-soft: #0A1B2E; --info-line: #1B416E; --info-ink: #9CC9FB;
    --ai: #A48CF0; --ai-soft: #1A1330; --ai-line: #3B2C6B; --ai-ink: #C8B9F8;
    --rest: #8AA0FA; --rest-soft: #121734; --rest-line: #2C3878; --rest-ink: #B6C4FC;
    --shadow-ink: 0 0 0;
    --e-1: 0 1px 2px -1px rgb(0 0 0 / 0.6);
    --e-2: 0 4px 14px -4px rgb(0 0 0 / 0.7), 0 1px 2px -1px rgb(0 0 0 / 0.5);
    --e-3: 0 16px 40px -12px rgb(0 0 0 / 0.8), 0 3px 8px -3px rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }
  .antd.tlight, .antd.tdark { background: var(--bg); padding: var(--sp-4); border-radius: var(--r-lg); }

  /* Forced-colours: every state that is carried by a token pair must
     survive a palette the operating system chooses. Selection keeps its
     fill via Highlight; the disabled diagonal keeps its stroke. */
  @media (forced-colors: active) {
    .antd .cal-d.sel, .antd .slot.on, .antd .chip.on, .antd .wdset b.on {
      background: Highlight; color: HighlightText; forced-color-adjust: none;
    }
    .antd .cal-d.kb, .antd .dtf.focus { outline: 2px solid CanvasText; outline-offset: 1px; }
    .antd .cal-d.dis::after { background: GrayText; }
  }

  /* ==================================================================== */
  /*  FORCED STATES — for the §22 matrix only.                            */
  /*  :hover cannot be photographed, and a matrix of screenshots is the   */
  /*  thing this report is trying not to be. These classes replay the     */
  /*  hover and focus rules on a live element so every cell is real.      */
  /* ==================================================================== */
  .antd .fs-hover.slot, .antd .fs-hover.cal-d { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }
  .antd .fs-hover.chip { border-color: var(--line-3); background: var(--sunken); color: var(--ink); }
  .antd .fs-hover.dtf  { border-color: var(--ink-4); }
  .antd .fs-focus.dtf  { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .antd .fs-focus.slot, .antd .fs-focus.chip, .antd .fs-focus.cal-d {
    outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring);
  }
  .antd .fs-focus.cal-d { z-index: 1; position: relative; }

  @keyframes ox-spin { to { rotate: 360deg } }
  @keyframes ox-shimmer { to { background-position-x: -200% } }
  .antd .sk.live { background-size: 200% 100%; animation: ox-shimmer 1.4s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .antd .sk.live { animation: none }
    .antd .i[style*="ox-spin"] { animation: none !important }
  }

  .antd .durbox.err { border-color: var(--crit); background: var(--crit-soft); color: var(--crit-ink); }

  /* auto-fit leaves an orphan tile whenever the item count is not a multiple
     of the columns it happens to choose. Pin the two counts we actually use. */
  .kpi.k4 { grid-template-columns: repeat(4, 1fr); }
  .kpi.k5 { grid-template-columns: repeat(5, 1fr); }
  .kpi.k4 .v, .kpi.k5 .v { font-size: 1.4rem; }
  .kpi.k4 .l, .kpi.k5 .l { font-size: 0.72rem; }
  @media (max-width: 620px) {
    .kpi.k4, .kpi.k5 { grid-template-columns: repeat(2, 1fr); }
  }

  /* A placeholder must read as ABOVE the surface, not as a hole in it.
     The base sheet builds the shimmer out of --sunken, which is darker than
     --surface in both themes — correct on light, and on dark it renders a
     loading slot as a black rectangle that looks like a failure. Mixing
     against ink instead flips with the theme, as it should. */
  .antd .sk {
    background: linear-gradient(100deg,
      color-mix(in oklab, var(--ink) 7%, var(--surface)) 30%,
      color-mix(in oklab, var(--ink) 14%, var(--surface)) 48%,
      color-mix(in oklab, var(--ink) 7%, var(--surface)) 66%);
    background-size: 200% 100%;
  }
  @media (prefers-reduced-motion: reduce) {
    .antd .sk { background: color-mix(in oklab, var(--ink) 9%, var(--surface)); }
  }

  /* The month/year pane, the segmented controls and the weekday toggles are
     real <button>s now, so the style hooks have to name them as well as the
     tags the first draft used. A control that needs a keydown shim to be
     operable is a control that should have been a button. */
  .antd .cal-pane b, .antd .cal-pane button {
    height: 30px; display: grid; place-items: center; border-radius: var(--r-xs);
    font-size: var(--fs-sm); font-weight: var(--fw-r); color: var(--ink); width: 100%;
  }
  .antd .cal-pane b:hover, .antd .cal-pane button:hover { background: var(--sunken); }
  .antd .cal-pane b.on, .antd .cal-pane button.on { background: var(--accent); color: var(--on-accent); font-weight: var(--fw-m); }
  .antd .a-seg button {
    padding: 0 var(--sp-2); height: calc(var(--ctl-md) - 6px);
    display: inline-flex; align-items: center; border-radius: 2px;
    font-size: var(--fs-xs); font-weight: var(--fw-m); color: var(--ink-3);
    transition: color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
  }
  .antd .a-seg button:hover { color: var(--ink); }
  .antd .a-seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--e-1), var(--hair); }
  .antd .a-seg button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ring); }
  .antd .wdset button {
    width: 32px; height: 32px; display: grid; place-items: center;
    border: 1px solid var(--line-2); border-radius: var(--r-full);
    font-size: var(--fs-xs); font-weight: var(--fw-m); color: var(--ink-2); background: var(--surface);
    transition: background-color var(--dur-micro) var(--ease-out),
                border-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
  }
  .antd .wdset button:hover { border-color: var(--line-3); background: var(--sunken); }
  .antd .wdset button.on { background: var(--accent); border-color: transparent; color: var(--on-accent); }

  /* A legend swatch is a picture of a control, not a control. */
  .antd .slot.swatch {
    width: 22px; height: 16px; min-width: 0; font-size: 0; pointer-events: none;
  }

  /* SC 2.5.8 again: the base sheet sizes a segment at `--ctl-md - 6` = 22px,
     which was defensible when segments were divs and arguably not targets.
     They are buttons now, so they owe the 24px floor like everything else. */
  .antd .a-seg button { height: var(--ctl-sm); min-width: var(--ctl-sm); }
  .antd .dtf .fb { border-radius: var(--r-xs); }

  /* Form controls the UA still styles: a checkbox carries a 3px top margin
     that puts its row a hair off the baseline of the label beside it. */
  .antd input[type="checkbox"] {
    margin: 0; inline-size: 14px; block-size: 14px; accent-color: var(--accent);
  }
  .antd label { display: inline-flex; align-items: center; gap: var(--sp-2); }

  /* The reason list under a calendar. On the antd type scale, not the
     document's rem scale, because it sits inside the mockup. */
  .antd .callout { display: grid; gap: var(--sp-1); margin-top: var(--sp-2); }
  .antd .callout > span { font-size: var(--fs-xs); color: var(--ink-3); line-height: var(--lh-sm); }
  .antd .callout > span b { color: var(--ink-2); font-weight: var(--fw-sb); }

  /* ==================================================================== */
  /*  RIGHT-TO-LEFT                                                       */
  /*  Logical properties give us the mirror for free. Two things they do  */
  /*  not give us: a chevron still points the way it was drawn, and a     */
  /*  numeric value must not mirror with the layout around it.            */
  /* ==================================================================== */
  /* Anchored on the dir attribute itself, not on `.antd`: in practice the
     RTL container is INSIDE the component root, so `.antd [dir=rtl]` and
     `[dir=rtl] .antd` are both real nestings and only this matches both. */
  [dir="rtl"] .cal-nav svg,
  [dir="rtl"] .arw svg,
  [dir="rtl"] svg.i-arrow { scale: -1 1; }

  /* The value itself is always LTR — set on the element, so it survives
     being dropped into an RTL form without the host thinking about it. */
  .antd .dtf,
  .antd .durbox,
  .antd .slot,
  .antd .cal-d,
  .antd .tapelabels,
  .antd .ro-grid dd { unicode-bidi: isolate; }

  /* ==================================================================== */
  /*  SEVERITY RAILS — repairing a specificity defect in the base sheet.  */
  /*                                                                      */
  /*  base.css flattens a tile inside a card and then restores its status */
  /*  with `.antd .a-card .tile.crit { border-color: currentColor }` —    */
  /*  four classes, (0,4,0). The rule that actually paints the rail is    */
  /*  `.antd .tile.crit { border-inline-start: 2px solid var(--crit) }`,  */
  /*  three classes, (0,3,0). The flatten wins on specificity no matter   */
  /*  what order they load in, so EVERY severity rail inside a card —     */
  /*  critical, warning, ok, ai and selected — renders in the ink colour  */
  /*  and the five states become one. Colour carrying meaning, with the   */
  /*  colour absent, is an ENGINEERING.md §6 failure rather than a nit.   */
  /*                                                                      */
  /*  Matched at (0,4,0) and loaded later, so it wins on order.           */
  /* ==================================================================== */
  .antd .a-card .tile.crit, .antd .a-app .tile.crit { border-inline-start-color: var(--crit); }
  .antd .a-card .tile.warn, .antd .a-app .tile.warn { border-inline-start-color: var(--warn); }
  .antd .a-card .tile.ok,   .antd .a-app .tile.ok   { border-inline-start-color: var(--ok); }
  .antd .a-card .tile.ai,   .antd .a-app .tile.ai   { border-inline-start-color: var(--info); }
  .antd .a-card .tile.sel,  .antd .a-app .tile.sel  { border-inline-start-color: var(--accent); }
  .antd .a-card .tile.ghost,.antd .a-app .tile.ghost{ border-color: var(--line-2); }

  /* The rail is the primary cue, so it also carries a tint at the low end
     of the scale — a 2px line is not enough signal on its own for a state
     a clinician has to notice, and it is invisible to a reader who cannot
     resolve a hairline. Shape and word still do the real work. */
  .antd .a-card .tile.crit, .antd .a-app .tile.crit {
    background: color-mix(in oklab, var(--crit) 7%, var(--sunken));
  }
  .antd .a-card .tile.warn, .antd .a-app .tile.warn {
    background: color-mix(in oklab, var(--warn) 7%, var(--sunken));
  }
  .antd .a-card .tile.ok, .antd .a-app .tile.ok {
    background: color-mix(in oklab, var(--ok) 7%, var(--sunken));
  }

  /* ==================================================================== */
  /*  NAME COLLISION — `.wrap` is the document's page container.          */
  /*                                                                      */
  /*  The mockup convention in this series is `class="row wrap"` for a    */
  /*  wrapping flex row, and `.wrap` is ALSO the report's own 1180px      */
  /*  centred page container: `max-width: 1180px; margin: 0 auto;         */
  /*  padding: 0 clamp(1rem, 4vw, 2.5rem)`. Every wrapping row in every   */
  /*  figure was therefore inheriting auto side margins and up to 40px of */
  /*  page padding — which centres it and indents its first child. It is  */
  /*  invisible on a full-width row and obvious on a short one.           */
  /*                                                                      */
  /*  Neutralised here rather than renamed, because the markup convention */
  /*  is shared with the other briefs in the series.                      */
  /* ==================================================================== */
  .antd .row.wrap,
  .antd .wrap {
    max-width: none;
    margin-inline: 0;
    padding-inline: 0;
  }

  /* ==================================================================== */
  /*  INK-5 IS A NON-TEXT TOKEN.                                          */
  /*                                                                      */
  /*  That was settled in the healthcare-50 redesign: the 4.5:1 floor     */
  /*  genuinely limits how many greys can carry small text on light, so   */
  /*  --ink-5 is reserved for dividers, disabled glyphs and decoration.   */
  /*  The first draft of this component spent it on numerals — weekend    */
  /*  headers at 2.5:1, out-of-month days at 2.5:1, disabled days at      */
  /*  2.2:1. Disabled controls are exempt from 1.4.3, but "exempt" is a   */
  /*  legal answer, not a legible one, and an out-of-month day in a range */
  /*  picker is not disabled at all — it is a target.                     */
  /*                                                                      */
  /*  All of them move to --ink-4, which clears 4.5:1 on the sunken       */
  /*  ground. The state stays distinguishable because it was never        */
  /*  carried by the grey alone: disabled keeps its diagonal, out-of-     */
  /*  month keeps its lighter weight against --ink.                       */
  /* ==================================================================== */
  /*  The rule, applied once and everywhere:                             */
  /*    non-disabled dimmed text  -> --ink-3   (clears 4.5:1 on every     */
  /*                                            ground in both themes)    */
  /*    disabled controls         -> --ink-4   (exempt from 1.4.3, and    */
  /*                                            still legible)            */
  /*    --ink-5                   -> never on a word                      */
  /*                                                                      */
  /*  --ink-4 was the first answer and it fails in DARK on two grounds    */
  /*  the light theme never presents: --overlay (a bottom sheet, 3.95:1)  */
  /*  and --accent-soft (a selected day strip, 3.81:1). Auditing one      */
  /*  theme would have shipped both.                                      */
  .antd .cal-wd { color: var(--ink-3); }
  .antd .cal-wd.we { color: var(--ink-3); opacity: 0.78; }
  .antd .cal-d.out { color: var(--ink-3); }
  /* Disabled days end up on --ink-3 as well, not a second grey. They are
     exempt from 1.4.3, but on the bottom sheet's --overlay ground --ink-4
     lands at 3.95:1 and "exempt" is not the same as readable. The state is
     carried by the diagonal, which is a shape and survives both a palette
     the user chose and a reader who cannot separate two greys. */
  .antd .cal-d.dis { color: var(--ink-3); }
  .antd .cal-d.out.rng, .antd .cal-d.out.prev { color: var(--accent-ink); opacity: 0.75; }
  .antd .cal-pane b.dis, .antd .cal-pane button.dis { color: var(--ink-4); }
  .antd .slot.off { color: var(--ink-4); }
  .antd .chip.dis { color: var(--ink-4); }
  .antd .daycell .wd { color: var(--ink-3); }
  .antd .daycell.on .wd { color: var(--accent-ink); }
  .antd .daycell.none .ct, .antd .daycell.none .dd { color: var(--ink-4); }
  .antd .msg.hint { color: var(--ink-3); }
  .antd .dtf .sep { color: var(--ink-3); }
  .antd .dtf .seg.ph { color: var(--ink-3); }
  .antd .occ > li .n { color: var(--ink-3); }
  .antd .drvtag { color: var(--ink-3); }
  .antd .tapelabels { color: var(--ink-3); }
  .antd .a-tag.plain { color: var(--ink-3); }
  .smx .na { color: var(--ink-3); }

  /* The avatar monogram lands at 4.49:1 in light — accent on accent-soft,
     one hundredth under the floor. The ink step of the same hue clears it
     without changing the chip's identity. */
  .antd .node.clinical { color: var(--accent-ink); }
  .antd .node.comms { color: var(--info-ink); }
  .antd .node.reported { color: var(--ai-ink); }
  .antd .node.critical { color: var(--crit-ink); }

  /* ==================================================================== */
  /*  REFLOW — SC 1.4.10, at 320px.                                       */
  /*                                                                      */
  /*  The page never scrolls in two dimensions: a wide figure scrolls     */
  /*  inside its own .stage, which is the correct pattern for a table or  */
  /*  a state matrix. But a figure that is DEMONSTRATING responsive       */
  /*  behaviour has to actually reflow, or the report is asserting        */
  /*  something its own mockups do not do.                                */
  /* ==================================================================== */
  @media (max-width: 560px) {
    .antd .ro-grid { grid-template-columns: 1fr; gap: 0 0; }
    .antd .ro-grid dt { margin-top: var(--sp-2); }
    .antd .tzpair { grid-template-columns: 1fr; gap: var(--sp-2); }
    .antd .tzpair > div:nth-child(2) { rotate: 90deg; justify-self: start; }
    .antd .sess { align-items: stretch; }
    .antd .sess .arw { rotate: 90deg; align-self: center; }
    .antd .daystrip { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); }
    .antd .slots { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
    .antd .cal { width: 100%; }
    .antd .phone { width: 100%; max-width: 300px; }
    .antd .a-card-head { flex-wrap: wrap; }
    .antd .row { flex-wrap: wrap; }
  }

  /* Two-column figure rows that must become one. Scoped by the inline
     grid template they were built with, so nothing else is caught. */
  @media (max-width: 640px) {
    .antd [style*="grid-template-columns:9rem"],
    .antd [style*="grid-template-columns: 9rem"],
    .antd [style*="grid-template-columns:8.5rem"],
    .antd [style*="grid-template-columns: 8.5rem"],
    .antd [style*="grid-template-columns:auto 1fr auto"],
    .antd [style*="grid-template-columns: auto 1fr auto"] {
      grid-template-columns: 1fr !important;
      gap: var(--sp-2) !important;
    }
    .antd .occ > li { grid-template-columns: 18px 1fr; }
    .antd .occ > li > :last-child { grid-column: 2; justify-self: start; }
  }

  @media (max-width: 560px) {
    /* The recurrence builder is the densest control cluster in the set:
       a segmented control, an interval row, seven weekday toggles and an
       end-condition row. All four have to wrap rather than scroll, because
       a control the user cannot see is a control they cannot set. */
    .antd .a-seg { flex-wrap: wrap; }
    .antd .wdset { flex-wrap: wrap; gap: var(--sp-1); }
    .antd .rrsum { overflow-wrap: anywhere; }
    .antd .chips { row-gap: var(--sp-1); }
    .antd .kpi.k4, .antd .kpi.k5, .kpi.k4, .kpi.k5 { grid-template-columns: repeat(2, 1fr); }
  }

  /* ==================================================================== */
  /*  MIN-CONTENT LEAKS                                                   */
  /*                                                                      */
  /*  A grid or flex child defaults to `min-width: auto`, which is its    */
  /*  min-content width. One `white-space: nowrap` element deep inside a  */
  /*  card therefore sets the width of the whole card — the RRULE string  */
  /*  was making the recurrence figure 580px wide at a 320px viewport and */
  /*  cutting off four controls that had nothing to do with it. The       */
  /*  element's own `overflow-x: auto` does not help until it is allowed  */
  /*  to be narrower than its content.                                    */
  /* ==================================================================== */
  .antd .a-card { max-width: min(560px, 100%); }
  .antd .a-card.wide { max-width: min(860px, 100%); }
  .antd .a-card.xwide { max-width: min(1040px, 100%); }
  .antd .rrsum, .antd .rrcode,
  .antd .a-card-body > *, .antd .fld, .antd .occ > li,
  .antd .tile > * { min-width: 0; }
  .antd .rrcode { max-width: 100%; }

  /* The other half of the min-content story, and the one that actually bit.
     A single-column grid with no explicit template places its children in an
     IMPLICIT column, and an implicit column is sized by `grid-auto-columns`,
     which defaults to `auto` — i.e. max-content. So a row of chips that is
     perfectly willing to wrap still widens its own track first and overflows
     the card. `min-width: 0` on the item does not help: it clamps the item's
     minimum, not the track's maximum.

     `grid-auto-columns` only ever affects implicit tracks, so a grid that
     declares its own template is untouched by this. */
  .antd .fld,
  .antd [style*="display: grid"],
  .antd [style*="display:grid"] { grid-auto-columns: minmax(0, 1fr); }


  /* Hairlines drawn on the cells, not as grid gaps showing the container
     through. 26 items never fill the last row of a responsive grid, and a
     gap-coloured container renders that remainder as a tinted block. */
  .hero .gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 0; margin-top: 2.25rem; background: var(--surface);
    border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
  }
  .hero .gx { box-shadow: inset -1px -1px 0 0 var(--rule); }
  .hero .gx {
    display: flex; align-items: baseline; gap: 0.5rem; padding: 0.5rem 0.7rem;
    background: var(--surface); color: var(--ink-2); text-decoration: none;
    font-size: 0.78rem; line-height: 1.3;
  }
  .hero .gx:hover { background: var(--accent-soft); color: var(--accent-ink); }
  .hero .gn { font-family: var(--font-mono); font-size: 0.66rem; color: var(--accent); font-weight: 700; }
  nav.toc a b { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); margin-inline-end: 0.3rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-top: -0.4rem; margin-bottom: 1rem; }
  section h3 { margin-top: 2.25rem; margin-bottom: 0.9rem; }
  section > .wrap > p { max-width: 74ch; }
  figure .stage { padding: clamp(0.9rem, 2.5vw, 1.5rem); }
